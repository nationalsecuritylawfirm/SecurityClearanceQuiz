<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Clearance Quiz</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:#1e3a5f; --navy-light:#2a4f82; --blue:#2563eb; --blue-light:#3b82f6;
  --bg:#f8fafc; --surface:#ffffff; --border:#e2e8f0; --border-md:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --t1:#059669; --t1-bg:#ecfdf5; --t1-border:#a7f3d0;
  --t2:#2563eb; --t2-bg:#eff6ff; --t2-border:#bfdbfe;
  --t3:#d97706; --t3-bg:#fffbeb; --t3-border:#fde68a;
  --t4:#ea580c; --t4-bg:#fff7ed; --t4-border:#fed7aa;
  --t5:#dc2626; --t5-bg:#fef2f2; --t5-border:#fecaca;
}
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
h1 { font-size:1.75rem; font-weight:700; line-height:1.25; }
h2 { font-size:1.25rem; font-weight:600; line-height:1.3; }
h3 { font-size:1rem; font-weight:600; }
p  { color:var(--text-2); }
.page-wide { max-width:1100px; margin:0 auto; padding:2rem 1.25rem 4rem; }
.navbar { background:var(--navy); padding:0 1.5rem; display:flex; align-items:center; gap:2rem; height:56px; position:sticky; top:0; z-index:100; }
.navbar-brand { color:white; font-weight:700; font-size:1rem; text-decoration:none; letter-spacing:.01em; white-space:nowrap; }
.navbar-links { display:flex; gap:.25rem; margin-left:auto; }
.navbar-link { color:rgba(255,255,255,.75); text-decoration:none; font-size:.875rem; padding:.4rem .75rem; border-radius:6px; transition:background .15s,color .15s; }
.navbar-link:hover,.navbar-link.active { background:rgba(255,255,255,.12); color:white; }
.btn { display:inline-flex; align-items:center; gap:.4rem; padding:.55rem 1.1rem; border-radius:7px; font-size:.9rem; font-weight:500; cursor:pointer; border:1px solid transparent; transition:background .15s,opacity .15s; text-decoration:none; white-space:nowrap; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-navy     { background:var(--navy); color:white; }
.btn-navy:hover:not(:disabled) { background:var(--navy-light); }
.btn-outline  { background:white; color:var(--text); border-color:var(--border-md); }
.btn-outline:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
.btn-danger   { background:white; color:#dc2626; border-color:#fecaca; }
.btn-danger:hover:not(:disabled)  { background:#fef2f2; }
.btn-sm { padding:.35rem .7rem; font-size:.8rem; }
input[type=text],input[type=email],input[type=tel],select,textarea { padding:.55rem .75rem; border:1px solid var(--border-md); border-radius:7px; font-size:.9rem; font-family:inherit; color:var(--text); background:white; width:100%; }
.tier-badge { display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .65rem; border-radius:999px; font-size:.78rem; font-weight:600; }
.tier-1 { background:var(--t1-bg); color:var(--t1); border:1px solid var(--t1-border); }
.tier-2 { background:var(--t2-bg); color:var(--t2); border:1px solid var(--t2-border); }
.tier-3 { background:var(--t3-bg); color:var(--t3); border:1px solid var(--t3-border); }
.tier-4 { background:var(--t4-bg); color:var(--t4); border:1px solid var(--t4-border); }
.tier-5 { background:var(--t5-bg); color:var(--t5); border:1px solid var(--t5-border); }
.tag { display:inline-block; padding:.2rem .55rem; background:var(--bg); border:1px solid var(--border); border-radius:999px; font-size:.78rem; color:var(--text-2); }
.text-muted { color:var(--text-3); font-size:.875rem; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.mt-1{margin-top:.25rem}
.hidden { display:none !important; }
  </style>
  <style>
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--navy); line-height: 1.2; }
    .stat-label { font-size: 0.78rem; color: var(--text-3); margin-top: 0.2rem; }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .filter-bar select { width: auto; flex: 1; min-width: 150px; max-width: 220px; }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    thead { background: var(--bg); }
    th {
      text-align: left;
      padding: 0.65rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .td-flags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .td-name  { font-weight: 500; }
    .td-date  { color: var(--text-3); white-space: nowrap; font-size: 0.8rem; }

    .empty-row td {
      text-align: center;
      padding: 3rem;
      color: var(--text-3);
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      line-height: 1;
    }
    .del-btn:hover { color: #dc2626; background: #fef2f2; }

    .actions-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    /* ── Detail drawer ── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.4);
      z-index: 200;
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
    }
    .drawer-panel {
      background: white;
      width: 480px;
      max-width: 100vw;
      height: 100%;
      overflow-y: auto;
      box-shadow: -4px 0 32px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }
    .drawer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: white;
      z-index: 1;
    }
    .drawer-title { font-size: 1rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
    .drawer-meta  { font-size: 0.8rem; color: var(--text-3); margin-top: 0.2rem; }
    .drawer-close {
      background: none; border: none; font-size: 1.3rem; color: var(--text-3);
      cursor: pointer; padding: 0 0.25rem; line-height: 1; flex-shrink: 0; margin-left: 1rem;
    }
    .drawer-close:hover { color: var(--text); }
    .drawer-body { padding: 1.25rem 1.5rem; flex: 1; }
    .drawer-section { margin-bottom: 1.75rem; }
    .drawer-section-title {
      font-size: 0.7rem; font-weight: 700; color: var(--text-3); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 0.65rem;
      padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    }
    .dl-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .dl-table td { padding: 0.45rem 0; vertical-align: top; border-bottom: 1px solid var(--border); }
    .dl-table tr:last-child td { border-bottom: none; }
    .dl-label { color: var(--text-2); width: 150px; padding-right: 0.75rem; flex-shrink: 0; }
    .dl-value  { color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .qa-item   { margin-bottom: 0.9rem; }
    .qa-q { font-size: 0.78rem; color: var(--text-3); margin-bottom: 0.2rem; }
    .qa-a { font-size: 0.875rem; color: var(--text); font-weight: 500; }
    .tag-group-label {
      font-size: 0.72rem; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; margin-top: 0.75rem;
    }
    .tag-group-label:first-child { margin-top: 0; }

    .view-btn {
      background: none; border: none; color: var(--blue);
      cursor: pointer; font-size: 0.8rem; font-weight: 500;
      padding: 0.2rem 0.45rem; border-radius: 4px; line-height: 1; margin-right: 0.2rem;
    }
    .view-btn:hover { background: var(--t2-bg); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="index.html">Clearance Quiz</a>
    <div class="navbar-links">
      <a class="navbar-link" href="index.html">Quizzes</a>
      <a class="navbar-link active" href="admin.html">Analytics</a>
      <a class="navbar-link" href="builder.html">Builder</a>
    </div>
  </nav>

  <div class="page-wide">
    <div class="flex-between" style="margin-bottom:1.5rem;flex-wrap:wrap;gap:0.75rem;">
      <div>
        <h1 style="color:var(--navy)">Analytics</h1>
        <p class="text-muted mt-1">All quiz responses — stored locally in this browser.</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Filter + export bar -->
    <div class="actions-bar">
      <div class="filter-bar" style="margin:0;flex:1;">
        <select id="filter-quiz" onchange="applyFilters()">
          <option value="">All quizzes</option>
        </select>
        <select id="filter-tier" onchange="applyFilters()">
          <option value="">All results</option>
          <option value="5">Tier 5</option>
          <option value="4">Tier 4</option>
          <option value="3">Tier 3</option>
          <option value="2">Tier 2</option>
          <option value="1">Tier 1</option>
          <option value="null">Assessment (no tier)</option>
        </select>
      </div>
      <button class="btn btn-outline btn-sm" onclick="exportCsv()">Export CSV</button>
      <button class="btn btn-danger btn-sm" onclick="clearAll()">Clear All</button>
    </div>

    <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Quiz</th>
              <th>Result</th>
              <th>Flags</th>
              <th>Name</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="responses-tbody">
            <tr class="empty-row"><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
    </div>
  </div>

  <!-- Response detail drawer -->
  <div id="response-drawer" class="drawer-overlay hidden" onclick="closeDrawer(event)">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <div class="drawer-title" id="drawer-title"></div>
          <div class="drawer-meta" id="drawer-meta"></div>
        </div>
        <button class="drawer-close" onclick="document.getElementById('response-drawer').classList.add('hidden')">×</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <script>
const SEED_QUIZZES=[{id:'sf86-red-flags',version:2,slug:'sf86-red-flags',title:'SF-86 Readiness Check',subtitle:'Do You Have Any Security Clearance Red Flags?',groundingNote:'',questions:[],results:[{tier:1,label:'Ready to Submit — Keep It Accurate',forPeopleWith:'Complete history, no major issues, and no inconsistency concerns.',message:'Your answers suggest you may be in a good position to continue preparing your questionnaire. The most important next step is accuracy: make sure dates, addresses, contacts, and explanations are complete before submission.',ctaText:'Download the SF-86 final review checklist',ctaType:'download',tags:[]},{tier:2,label:'Information Gaps — Gather Details Before Submitting',forPeopleWith:'People missing dates, addresses, employment details, foreign travel details, supervisor contacts, or court records.',message:'Your answers suggest the biggest issue may not be a legal red flag, but missing or incomplete information. Before submitting, gather documents and clarify gaps so your answers are consistent and complete.',ctaText:'Get the SF-86 document checklist',ctaType:'download',tags:[]},{tier:3,label:'Potential Red Flags — Explanation May Matter',forPeopleWith:'People with debt, foreign contacts, drug use, alcohol issues, police history, or similar concerns.',message:'Your answers suggest one or more areas may require careful explanation. A red flag does not automatically mean denial, but the way you disclose, explain, and document the issue can matter.',ctaText:'Schedule a pre-submission clearance consultation',ctaType:'schedule',tags:[{id:'foreign-concern',label:'Foreign Contacts, Travel, or Interests',message:'Foreign contacts, travel, and financial interests must be disclosed on the SF-86 — not because having them creates a disqualification, but because incomplete or inconsistent disclosure can create a larger problem than the underlying relationship or trip. Every foreign national contact, foreign travel, foreign financial account, dual citizenship, property, and business interest must be accurately reported under the applicable questions. If you are unsure what to include, err toward disclosure — the consequences of omitting a foreign contact are generally more serious than including a benign one.'},{id:'financial-concern',label:'Financial Issue',message:'Financial problems are among the most common — and most manageable — issues in security clearance investigations, provided they are disclosed accurately, explained clearly, and supported by documentation of the steps you have taken. Investigators consider the cause of the problem, the current status, and the trend: whether you are addressing the issue matters more than whether the issue exists. Organize your records, document your mitigation plan, and prepare to explain the circumstances consistently with your credit report, tax records, and any court documents.'},{id:'criminal-concern',label:'Police, Court, or Criminal History',message:'Criminal history — including arrests, charges, DUIs, summons, restraining orders, and court appearances — must generally be disclosed on the SF-86 regardless of how the case was resolved, whether the charges were dropped, or whether the record was later expunged. The disclosure obligation runs from the date of the event, not the date of final disposition. Incomplete or inconsistent disclosure of criminal history is often treated more seriously than the underlying incident. Gather the complete record: the arrest report, the docket, the disposition, and any expungement or sealing order.'},{id:'drug-concern',label:'Drug or Substance Issue',message:'Drug use — including marijuana, THC products, CBD/delta products from unregulated sources, and other controlled substances — is a disclosable issue on the SF-86. For active clearance holders, use after starting the clearance process is treated more seriously than historical use. For applicants, the key factors are recency, frequency, and whether the use has stopped. If you are unsure how a particular substance or circumstance should be described, consult an attorney before submitting — an inconsistent or inaccurate disclosure can create a larger problem than the use itself.'},{id:'alcohol-concern',label:'Alcohol-Related Incident or Treatment',message:'Alcohol-related incidents — including DUIs, DWIs, public intoxication, alcohol-related employment or military problems, and treatment history — are disclosable on the SF-86. A single isolated incident that is old and resolved is usually addressed with an accurate disclosure and a clear explanation. Repeated incidents, recent incidents, treatment history, or work-related alcohol problems require more careful handling. Gather the full record of each incident and any treatment documentation, and be prepared to explain what has changed.'},{id:'prior-clearance-concern',label:'Prior Clearance Issue',message:'A prior clearance denial, suspension, revocation, interim denial, or SOR/LOI is a significant factor in a new clearance application — but it does not automatically prevent approval. What matters is how the prior action was handled, what the underlying issue was, whether it has been resolved, and what has changed since. Investigators will look closely at whether you disclosed the prior action accurately and completely. Gather the full documentation: the original notice, any appeal or response you submitted, and records showing what has changed since the prior action.'}]},{tier:4,label:'Disclosure Accuracy Concern — Be Careful Before Submitting, Updating, or Correcting',forPeopleWith:'People who already submitted, omitted something, gave inconsistent information, or are worried they answered incorrectly.',message:'Your answers suggest the issue may involve disclosure accuracy, consistency, or completeness. Before submitting, updating, or correcting prior answers, consider getting advice on how to explain the issue clearly and accurately.',ctaText:'Speak with a clearance attorney before submitting a correction',ctaType:'contact',tags:[{id:'disclosure-uncertainty',label:'Not Sure Whether to Disclose',message:'When the answer to a disclosure question is uncertain, the safer choice is almost always to disclose and explain rather than omit and hope the question does not apply. SF-86 questions are broadly written — they are designed to capture more rather than less. If you have any doubt about whether a particular event, contact, charge, or issue falls within a question\'s scope, document it and include an accurate, brief explanation. Consult an attorney before submitting if the uncertainty involves a criminal matter, a foreign contact, or a drug or alcohol issue.'},{id:'omission-concern',label:'Omission or Prior Misstatement',message:'Omitting information from the SF-86 — even unintentionally — can raise a candor concern that is treated more seriously than the underlying issue. Before submitting any correction or supplement, understand exactly what was originally submitted, identify the specific gap or error, and determine whether the omission appears inadvertent or part of a pattern. The timing and manner of a correction matters significantly: a voluntary, well-explained correction submitted before an investigator raises the issue is treated very differently from one submitted in response to a direct question. Consult an attorney before supplementing or correcting a prior submission.'},{id:'inconsistency-concern',label:'Inconsistent Prior Answer',message:'If your current answers differ from information you previously provided — on a prior SF-86, in an investigator interview, or on other government forms — the discrepancy will likely be identified and may be treated as a candor concern. Before submitting, identify the specific inconsistency, determine its cause (changed facts, better recollection, or a prior error), and prepare a clear, documented explanation. Inconsistencies between current and prior submissions are one of the most common grounds for adverse clearance determinations — and one of the most preventable.'},{id:'correction-needed',label:'Submitted — Correction May Be Needed',message:'If you have already submitted an SF-86 and recognized something that should be corrected, the timing of the correction matters. Contacting the investigator or your FSO promptly to provide accurate information is generally treated as cooperative and favorable. Waiting until the issue is raised by the investigator is treated differently. An attorney can help you identify the best approach — whether that is a supplemental statement, direct communication with the investigator, or a correction through your security officer — and frame the correction in a way that minimizes additional risk.'}]},{tier:5,label:'Government Action — High Urgency',forPeopleWith:'People who received an LOI, SOR, interrogatories, suspension, revocation, denial, or hearing notice.',message:'Your answers suggest the matter may already be in a response or appeal stage. The next step is to identify the document type, agency, allegations, and evidence before submitting anything.',ctaText:'Request an urgent case review',ctaType:'contact',tags:[]}]],availableFlags:[],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[]}},{id:'debt-taxes-clearance-risk',version:2,slug:'debt-taxes-clearance-risk',title:'Debt, Taxes & Security Clearance Risk Check',subtitle:'Could Your Financial Issue Affect Your Clearance?',groundingNote:'',questions:[],results:[{tier:1,label:'No Major Financial Issue Flagged — Keep It Accurate',forPeopleWith:'People with no financial issue, no missing records, no disclosure concern, and no government contact.',message:'Your answers did not flag an obvious financial clearance concern in this quiz. The most important next step is accuracy: keep your financial, tax, credit, and court-related information complete and consistent.',ctaText:'Download the Financial Clearance Final Review Checklist',ctaType:'download',tags:[]},{tier:2,label:'Information or Documentation Gap — Pull Records First',forPeopleWith:'People with unknown credit report issues, missing documents, uncertain tax records, or unclear payment status.',message:'Your answers suggest the biggest issue may be incomplete information. Before submitting, updating, or explaining anything, gather the records needed to understand the issue clearly.',ctaText:'Get the Financial Records Checklist',ctaType:'download',tags:[]},{tier:3,label:'Resolved or Managed Financial Issue — Document Your Mitigation',forPeopleWith:'People with past debt, late payments, collections, tax issues, or bankruptcy that has been resolved or is on a payment plan.',message:'Your answers suggest the financial issue may already be resolved or being handled. The key is showing what happened, what changed, and what documents support your explanation.',ctaText:'Get the Financial Mitigation Checklist',ctaType:'download',tags:[{id:'tax-issue',label:'Tax Debt or IRS Issue',message:'Tax debt and unfiled returns are treated as a distinct category in security clearance financial reviews. Investigators consider whether the problem reflects poor financial judgment, willful non-compliance, or a temporary hardship — and whether you are taking concrete steps to resolve it. The IRS offers installment agreements, currently-not-collectible status, and offer-in-compromise programs that adjudicators recognize as responsible mitigation steps. Gather complete records: the IRS transcript showing what is owed, any notices, and documentation of your payment agreement or resolution plan.'},{id:'bankruptcy-judgment',label:'Bankruptcy, Judgment, Lien, or Garnishment',message:'Bankruptcies, civil judgments, liens, wage garnishments, foreclosures, and repossessions are all disclosable events that will appear in your financial and court record review. These are not automatic disqualifiers — what matters is the cause, the timeline, and how the situation has been resolved. Documentation is critical: the bankruptcy filing and discharge paperwork, the judgment or lien records, any satisfaction of judgment, and evidence of current financial stability. An organized, well-documented explanation of what happened and what has changed carries significant weight in the mitigation analysis.'},{id:'gambling-unexplained',label:'Gambling, Unexplained Income, or Unexplained Assets',message:'Gambling problems, unexplained income, and unexplained assets are among the more sensitive financial concerns in clearance investigations because they can suggest coercion risk, undisclosed foreign income, unreported activities, or financial instability. If gambling is involved, documentation of cessation, treatment if applicable, and financial recovery are the key mitigation factors. If the concern involves unexplained income or assets, documented source verification is essential. An attorney can help you structure an accurate, complete explanation before submitting.'}]},{tier:4,label:'Active Financial Concern — Action Plan May Matter',forPeopleWith:'People with current delinquent debt, unpaid taxes, unresolved collections, no payment plan, or ongoing financial problems.',message:'Your answers suggest there may be an active financial issue that needs attention. A financial red flag does not automatically decide the outcome, but the way you address, document, and explain the issue can matter.',ctaText:'Schedule a Financial Clearance Strategy Consultation',ctaType:'schedule',tags:[{id:'active-delinquency',label:'Currently Delinquent — No Resolution Yet',message:'An active, unresolved delinquency — debt that is currently past due with no payment plan or resolution in place — is a factor that adjudicators take seriously, not because past-due debt automatically disqualifies an applicant, but because the absence of a plan raises questions about financial responsibility going forward. The most effective step you can take now is to develop and document a concrete resolution plan. Even a recent commitment to address the issue — if documented and consistent — can significantly change the analysis.'},{id:'active-legal-action',label:'Active Legal or Collection Action',message:'An active lawsuit, judgment, garnishment, lien, levy, foreclosure, or eviction proceeding is a more serious financial concern than unpaid debt alone because it has escalated into a formal legal action that is easily documentable by investigators. At this stage, the most important steps are understanding the specific action, identifying what resolution options remain, and developing a plan. An attorney who handles both financial clearance issues and the underlying legal matter can help you address both simultaneously.'},{id:'pattern-concern',label:'Pattern of Financial Problems',message:'A pattern of repeated financial problems — recurring late payments, ongoing debt, or multiple missed obligations — raises a different concern than a one-time hardship. Investigators distinguish between a temporary crisis that resolved and did not recur, and a behavioral pattern that suggests ongoing financial judgment issues. If your situation involves repeated problems over time, the most important elements of your mitigation are demonstrating what specifically changed, why it will not recur, and what steps are in place to maintain financial stability going forward.'},{id:'gambling-risk',label:'Gambling or Unexplained Assets as a Cause',message:'When gambling is identified as a cause of financial problems, adjudicators treat it as a more complex concern than simple overspending or hardship — because gambling suggests an ongoing risk of coercion, unexplained financial activity, and potential recurrence. If the gambling has stopped, documentation of cessation, treatment if applicable, and financial recovery is critical. If the concern involves unexplained income or assets, be prepared to provide documented source verification. An attorney can help you structure an explanation that addresses the security concern directly.'},{id:'agency-contact',label:'Investigator or Security Office Has Asked Questions',message:'You indicated that an investigator, FSO, security office, HR, command, or supervisor has already asked questions about the financial issue. This means the matter has entered the formal investigation record. How you respond to any follow-up questions — and whether your answers are consistent with your submitted paperwork — matters. If you receive a request for documents, additional questions, or a written statement, consult an attorney before responding.'}]},{tier:5,label:'Disclosure or Government Action Concern — High Urgency',forPeopleWith:'People with a possible omission, inaccurate prior answer, self-reporting concern, written request, LOI, SOR, denial, suspension, revocation, or deadline.',message:'Your answers suggest the issue may involve disclosure accuracy, self-reporting, or a government response stage. Before submitting a correction, written statement, or response, identify the document type, deadline, agency, and allegations.',ctaText:'Request an Urgent Financial Clearance Case Review',ctaType:'contact',tags:[{id:'disclosure-uncertainty',label:'Submitted — Not Sure If Answer Was Correct',message:'Uncertainty about whether a prior submission was accurate is a disclosure concern that should be resolved before the investigation advances further. If you answered incorrectly, the best outcome comes from identifying and correcting the issue proactively — before the investigator asks about it. Before contacting your FSO or security officer, understand exactly what you submitted and what the correct answer should be. An attorney can help you determine the scope of the issue and the best approach for correcting it without creating additional risk.'},{id:'disclosure-omission',label:'Omission or Inaccurate Prior Answer',message:'Omitting financial information or providing inaccurate dates, amounts, or status on a clearance-related submission can become a candor concern that outlasts the underlying financial issue. Before submitting any correction, understand exactly what you submitted, identify the specific gap or inaccuracy, and determine whether the problem appears inadvertent or part of a pattern. An attorney can help you frame and submit a correction in a way that presents the facts accurately and minimizes additional risk.'},{id:'disclosure-inconsistency',label:'Inconsistent Prior Answer',message:'If your current understanding of the financial issue differs from what you previously told an investigator, submitted on a clearance application, or stated in a security interview, the inconsistency will likely be identified and flagged. Before taking any action, identify the specific discrepancy and its cause — changed facts, better records, or a prior error. An attorney can help you understand the scope of the inconsistency, determine the best way to address it, and prepare an explanation that is accurate and appropriately framed.'},{id:'self-reporting-concern',label:'Active Clearance Holder — Self-Reporting Question',message:'Active clearance and public trust position holders have ongoing self-reporting obligations when their financial circumstances change in ways that could affect their eligibility. If you are unsure whether your financial situation requires a self-report, the safest step is to confirm your agency\'s specific self-reporting requirements — and to do so before the issue is identified in a reinvestigation or reported by a third party. An attorney who handles security clearance matters can help you evaluate whether a report is required and how to prepare it.'},{id:'written-request',label:'Written Request for Statement or Documents',message:'A written request for a financial statement, documents, or explanation means the security review has reached a formal stage — your response will be part of the official record. Before responding, understand exactly what is being asked, gather the relevant records, and make sure your response is accurate and consistent with everything you have previously submitted. An attorney can review the specific request and help you respond in a way that is complete, accurate, and appropriately framed for the security review process.'},{id:'formal-action',label:'LOI, SOR, Denial, Suspension, or Revocation',message:'A Letter of Interrogatory, Statement of Reasons, denial notice, suspension, or revocation related to a financial matter is a formal government action with legal deadlines and procedural requirements. Missing a deadline or responding without legal review is one of the most common — and most costly — mistakes in clearance appeals. An attorney who handles security clearance appeals can identify the specific allegations, the applicable adjudicative standards, and the response strategy that gives you the best chance of a favorable outcome.'},{id:'deadline-concern',label:'Deadline — Approaching, Missed, or Uncertain',message:'A deadline related to a financial disclosure, self-report, or government response is time-sensitive. The longer you wait, the harder it becomes to explain any delay as inadvertent rather than deliberate — and a missed response deadline can itself become a ground for adverse action. If you are uncertain whether a deadline has passed, act as if it has. An attorney can help you identify the applicable deadline, assess whether it has been missed, and determine the best approach for responding — even if the deadline has already passed.'}]}]],availableFlags:[],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'What type of issue?',issueTypeOptions:['Debt','Taxes','Bankruptcy','Collections','Garnishment','SOR or LOI','Other']}},{id:'self-reporting-checker',version:2,slug:'self-reporting-checker',title:'Self-Reporting Checker',subtitle:'Do You Need to Report This to Your Security Office?',groundingNote:"DCSA says clearance holders are required to self-report life events or incidents that could affect clearance eligibility, and that agencies may have different self-reporting procedures.",questions:[{id:'sr-q1',order:1,text:'What best describes your current status?',options:[{id:'sr-q1o1',text:'I currently hold a security clearance',tier:1,flags:[]},{id:'sr-q1o2',text:'I hold a public trust or sensitive position',tier:1,flags:[]},{id:'sr-q1o3',text:'I am an applicant or recently submitted, but I do not hold the clearance/position yet',tier:2,flags:['May not be covered by self-reporting requirements'],tag:'reporting-coverage'},{id:'sr-q1o4',text:'My access, clearance, or position is already suspended, restricted, or under review',tier:5,flags:['Access suspended or under review'],tag:'access-restricted'}]},{id:'sr-q2',order:2,text:'Any foreign travel, foreign contact, or foreign interest issue?',options:[{id:'sr-q2o1',text:'No',tier:1,flags:[]},{id:'sr-q2o2',text:'Foreign travel outside the U.S., including planned, recent, or unexpected travel',tier:3,flags:['Foreign travel'],tag:'foreign-issue'},{id:'sr-q2o3',text:'Foreign spouse, partner, roommate, close contact, or continuing foreign contact',tier:3,flags:['Foreign contact or relationship'],tag:'foreign-issue'},{id:'sr-q2o4',text:'Foreign citizenship, passport, voting, property, bank account, business, or financial interest',tier:3,flags:['Foreign citizenship or financial interest'],tag:'foreign-issue'},{id:'sr-q2o5',text:'I am not sure what foreign-related information counts',tier:2,flags:['Uncertainty about foreign reporting']}]},{id:'sr-q3',order:3,text:'Any police, criminal, DUI, or court issue?',options:[{id:'sr-q3o1',text:'No',tier:1,flags:[]},{id:'sr-q3o2',text:'Older or minor matter, now resolved',tier:2,flags:['Police or court history']},{id:'sr-q3o3',text:'Recent arrest, charge, DUI/DWI, summons, upcoming court date, probation/parole, or unresolved case',tier:3,flags:['Police or court history','Recent or pending legal matter'],tag:'criminal-matter'},{id:'sr-q3o4',text:'Serious or sensitive matter (felony, domestic violence, protective order, violence, firearms/explosives, or drug-related)',tier:3,flags:['Police or court history','Serious criminal matter'],tag:'criminal-matter'},{id:'sr-q3o5',text:'I am not sure whether I need to report it',tier:2,flags:['Disclosure uncertainty']}]},{id:'sr-q4',order:4,text:'Any financial issue?',options:[{id:'sr-q4o1',text:'No',tier:1,flags:[]},{id:'sr-q4o2',text:'Past financial issue, now resolved',tier:2,flags:['Financial issue']},{id:'sr-q4o3',text:'Current delinquent debt, collections, charge-offs, or inability to meet financial obligations',tier:3,flags:['Financial issue','Current delinquency'],tag:'financial-concern'},{id:'sr-q4o4',text:'Tax debt, bankruptcy, wage garnishment, lien, foreclosure, or eviction',tier:3,flags:['Financial issue','Tax or bankruptcy issue'],tag:'financial-concern'},{id:'sr-q4o5',text:'I am not sure what appears on my credit report or public records',tier:2,flags:['Unknown credit or public records']}]},{id:'sr-q5',order:5,text:'Any drug, alcohol, substance, or treatment-related issue?',options:[{id:'sr-q5o1',text:'No',tier:1,flags:[]},{id:'sr-q5o2',text:'Older isolated issue, now resolved',tier:2,flags:['Drug or alcohol issue']},{id:'sr-q5o3',text:'Recent marijuana/THC, drug, CBD/delta, or positive drug test issue',tier:3,flags:['Drug or substance issue'],tag:'substance-issue'},{id:'sr-q5o4',text:'DUI/DWI, alcohol-related incident, repeated alcohol incidents, or work/school/military alcohol issue',tier:3,flags:['Alcohol incident'],tag:'substance-issue'},{id:'sr-q5o5',text:'Substance abuse counseling/treatment, relapse, or counseling ordered because of conduct or performance',tier:3,flags:['Substance counseling or treatment'],tag:'substance-issue'}]},{id:'sr-q6',order:6,text:'Any classified information, security, cyber, media, or outside activity issue?',options:[{id:'sr-q6o1',text:'No',tier:1,flags:[]},{id:'sr-q6o2',text:'Lost or mishandled classified/sensitive information, badge, device, credentials, or government property',tier:5,flags:['Classified information or security incident'],tag:'security-incident'},{id:'sr-q6o3',text:'Possible unauthorized disclosure, spillage, cyber/IT misuse, or security violation',tier:5,flags:['Unauthorized disclosure or cyber issue'],tag:'security-incident'},{id:'sr-q6o4',text:'Foreign person asked about sensitive work, suspicious contact, coercion, blackmail, or exploitation concern',tier:5,flags:['Suspicious contact or coercion'],tag:'suspicious-contact'},{id:'sr-q6o5',text:'Outside employment/volunteer activity, foreign business, media contact, publication, public speaking, or concern about another covered person',tier:3,flags:['Outside activity or media contact'],tag:'outside-activity'}]},{id:'sr-q7',order:7,text:'Have you already reported the issue?',options:[{id:'sr-q7o1',text:'No, I have not reported it yet',tier:1,flags:[]},{id:'sr-q7o2',text:'Yes, I reported it verbally or informally',tier:2,flags:['Informal report only'],tag:'informal-report'},{id:'sr-q7o3',text:'Yes, I reported it in writing',tier:1,flags:[]},{id:'sr-q7o4',text:'I may have waited too long',tier:4,flags:['Reporting delay'],tag:'reporting-delay'},{id:'sr-q7o5',text:'I may have left something out or given inconsistent details',tier:4,flags:['Incomplete or inconsistent report'],tag:'incomplete-report'}]},{id:'sr-q8',order:8,text:'Has anyone contacted you, or is there a deadline?',options:[{id:'sr-q8o1',text:'No',tier:1,flags:[]},{id:'sr-q8o2',text:'My FSO, security office, HR, command, or supervisor asked basic follow-up questions',tier:3,flags:['Security office contact']},{id:'sr-q8o3',text:'I was asked for a written statement, documents, or explanation',tier:5,flags:['Written request from security office'],tag:'formal-inquiry'},{id:'sr-q8o4',text:'My access was suspended/restricted, or I received formal written questions or notice',tier:5,flags:['Access suspended or formal notice'],tag:'formal-inquiry'},{id:'sr-q8o5',text:'I have a deadline, the deadline passed, or I am not sure when it is due',tier:5,flags:['Deadline concern'],tag:'urgent-deadline'}]},{id:'sr-q9',order:9,text:'What would you like help with?',options:[{id:'sr-q9o1',text:'Figuring out whether or how to report something',tier:2,flags:[]},{id:'sr-q9o2',text:'Preparing a self-report or explanation',tier:3,flags:[]},{id:'sr-q9o3',text:'Fixing a late, incomplete, or inconsistent report',tier:4,flags:[]},{id:'sr-q9o4',text:'Responding to security questions, a deadline, suspension, or access restriction',tier:5,flags:[]},{id:'sr-q9o5',text:'Just understanding my risk',tier:1,flags:[]}]}],results:[{tier:1,label:'No Obvious Reporting Trigger Flagged — Confirm Agency Rules',forPeopleWith:'People with no flagged event, no government contact, no reporting delay, and no security-sensitive issue.',message:'Your answers did not identify an obvious self-reporting obligation based on the categories reviewed. Self-reporting requirements vary by agency, clearance level, and position — and some events require reporting even if they seem minor. If anything has changed in your personal, financial, or professional life since your last investigation, review your agency\'s specific requirements before concluding no report is needed.',ctaText:'Download the Security Clearance Self-Reporting Checklist',ctaType:'download',tags:[]},{tier:2,label:'Possible Reporting Issue — Clarify Before You Assume',forPeopleWith:'People with uncertainty about whether they are covered, older or minor resolved issues, or informal reporting only.',message:'Your situation may involve a reporting obligation that depends on specific details — your agency\'s policy, the timing of the event, how it was documented, and your current status. Before concluding no report is needed, confirm your agency\'s self-reporting procedures, gather the relevant dates and documents, and consider consulting a security clearance attorney if the situation remains unclear.',ctaText:'Get the Self-Reporting Preparation Checklist',ctaType:'download',tags:[{id:'reporting-coverage',label:'Am I Even Covered?',message:'You indicated you may not yet hold the clearance or position. Self-reporting requirements formally apply to clearance holders, but many attorneys recommend proactively documenting and reporting events that occur during a pending investigation — a later omission can create a bigger problem than the event itself. An attorney can help you decide whether voluntary disclosure makes sense in your situation.'},{id:'informal-report',label:'Verbal or Informal Report Only',message:'You reported verbally or informally. Verbal reports create no paper trail — if the event later surfaces in a reinvestigation or formal inquiry, there may be no record that you disclosed it. Consider following up in writing to your FSO or security office to create a documented record of your disclosure, even if a formal written report was not required.'}]},{tier:3,label:'Likely Self-Reporting Issue — Prepare a Clear Report',forPeopleWith:'People with foreign travel, foreign contacts, arrests, DUI or court issues, financial problems, drug or alcohol issues, or outside activities.',message:'Based on your answers, you appear to have a self-reporting obligation. The most important next step is preparing an accurate, complete account: what happened, when it happened, who was involved, whether it is ongoing, and what steps you have taken. A clear, organized self-report submitted before you are asked is consistently treated more favorably than one submitted after an investigation begins.',ctaText:'Schedule a Self-Reporting Strategy Consultation',ctaType:'schedule',tags:[{id:'foreign-issue',label:'Foreign Contact, Travel, or Interest',message:'Foreign travel, contacts, and financial interests are among the most frequently missed self-reporting categories. The obligation is not limited to contacts with hostile or covert actors — continuing relationships with foreign nationals, foreign travel (including personal travel), and foreign financial interests may all require disclosure. Your agency\'s FSO or reporting form can clarify what must be documented and when.'},{id:'criminal-matter',label:'Police, Court, or Legal Matter',message:'Arrests, criminal charges, DUIs, summons, and court appearances are typically self-reportable — often regardless of how the case is ultimately resolved or whether the record was expunged. The reporting obligation usually begins when the event occurs, not when the case closes. If you are unsure whether a specific matter is covered, document the full timeline and confirm with your FSO or an attorney before the deadline passes.'},{id:'financial-concern',label:'Financial or Debt Issue',message:'Financial problems — including unpaid debt, collections, judgments, garnishments, tax issues, and bankruptcy — can raise concerns under the financial considerations adjudicative guideline. What matters most is not only what happened, but whether you are taking steps to address it. A voluntary, organized disclosure that explains the circumstances and your plan to resolve the issue is far more effective than silence or a delayed report.'},{id:'substance-issue',label:'Drug, Alcohol, or Treatment Issue',message:'Drug use, alcohol incidents, and treatment history — including a positive drug test, DUI, alcohol-related incident, or referral for counseling — are typically reportable events, even when no legal action resulted. Agencies are required to consider context and rehabilitation, and voluntary disclosure before you are asked is consistently treated more favorably than a disclosure prompted by a third-party report or investigation.'},{id:'outside-activity',label:'Outside Employment or Media Activity',message:'Outside employment, consulting work, business activity, media contact, or public speaking related to your work or expertise may require prior approval or post-activity reporting depending on your agency and position. The obligations vary — some agencies require only disclosure after the fact, others require advance written approval. Confirm with your FSO before taking on any outside activity, and document any approval you receive.'}]},{tier:4,label:'Delay or Disclosure Concern — Be Careful Before Correcting',forPeopleWith:'People with a late report, incomplete report, inconsistent details, or omitted facts.',message:'Your answers suggest the issue may involve not only what happened, but also how and when it was reported. A late, incomplete, or inconsistent self-report creates a separate concern beyond the original event — specifically, whether the problem reflects an oversight or a pattern of poor candor. Before submitting any correction or supplement, organize the full timeline, identify what was and was not reported, and understand the reason the gap occurred.',ctaText:'Speak with a clearance attorney before correcting or supplementing a report',ctaType:'contact',tags:[{id:'reporting-delay',label:'Possible Late Report',message:'A delayed self-report raises two issues: the underlying event, and the failure to report it on time. How the delay is explained — and how quickly you act now — can significantly affect how the situation is evaluated. Investigators distinguish between an oversight and an intentional omission. An attorney can help you characterize the delay accurately, identify any mitigating factors, and submit a late report in a way that minimizes additional risk.'},{id:'incomplete-report',label:'Incomplete or Inconsistent Report',message:'An incomplete or inconsistent self-report can raise candor concerns that outlast the original issue. Before submitting any correction, you need to understand exactly what you previously reported, identify the specific gap or inconsistency, and determine the best approach — whether that is a written supplement, a corrected statement, or a formal clarification. An attorney can review your prior report and help you close the gap without creating additional problems.'}]},{tier:5,label:'Security Incident, Formal Inquiry, or Deadline — High Urgency',forPeopleWith:'People with classified information issues, unauthorized disclosure, suspicious contact, written security questions, access restriction, suspension, or deadline.',message:'Your answers suggest this situation requires prompt attention. The facts, the timing, and how you respond now can significantly affect the outcome. If you have been contacted by a security office, received a formal request, or have a deadline approaching, the decisions you make in the next few days matter. A security clearance attorney can help you understand what is being asked and how to respond accurately, completely, and in a way that protects your interests.',ctaText:'Request an urgent case review',ctaType:'contact',tags:[{id:'security-incident',label:'Classified Information or Security Incident',message:'Lost, mishandled, or improperly disclosed classified or sensitive information is treated as a security incident — not just a reporting obligation. These incidents typically require reporting through formal channels immediately, and your response becomes part of your security file. An attorney can help you respond in a way that is accurate, complete, and protective of your interests, and advise you on how to cooperate with any follow-up inquiry.'},{id:'suspicious-contact',label:'Suspicious Contact or Coercion',message:'Contact by a foreign intelligence officer, solicitation of classified information, an attempted coercion, or a blackmail attempt must be reported immediately under 32 CFR and most agency security policies. Early disclosure — with legal guidance on what to say and how to say it — is far better than delayed reporting after a formal investigation begins. Do not discuss the contact with unauthorized persons, and consult an attorney before submitting any written statement.'},{id:'formal-inquiry',label:'Formal Security Review or Written Request',message:'A written request for information, a formal notice, or a requirement to provide a written statement signals that a security review has already begun. Your response at this stage is part of the official record and will be evaluated for accuracy, completeness, and consistency with other available information. An attorney can review the specific request and help you respond in a way that is accurate, thorough, and appropriately framed.'},{id:'access-restricted',label:'Access Suspended, Restricted, or Under Review',message:'An active suspension or restriction of your access or clearance means a formal security determination process has likely already begun. What you say — and when — during this period can significantly affect the outcome. In some cases, you have the right to a written explanation and an opportunity to respond. An attorney who handles security clearance matters can advise you on your rights, the likely process and timeline, and how to respond if your agency or command directs questions to you.'},{id:'urgent-deadline',label:'Deadline — Approaching or Missed',message:'A missed or uncertain deadline is a time-sensitive problem. The longer you wait, the harder it becomes to characterize any delay as inadvertent rather than deliberate. If a deadline has already passed, prompt action now — with a clear, documented explanation of why the report was delayed — is still better than continued silence. An attorney can help you move quickly, frame the situation accurately, and minimize the risk that the delay becomes the central issue.'}]}],availableFlags:['Foreign travel','Foreign contact or relationship','Foreign citizenship or financial interest','Uncertainty about foreign reporting','May not be covered by self-reporting requirements','Police or court history','Recent or pending legal matter','Serious criminal matter','Disclosure uncertainty','Financial issue','Current delinquency','Tax or bankruptcy issue','Unknown credit or public records','Drug or alcohol issue','Drug or substance issue','Alcohol incident','Substance counseling or treatment','Classified information or security incident','Unauthorized disclosure or cyber issue','Suspicious contact or coercion','Outside activity or media contact','Access suspended or under review','Informal report only','Reporting delay','Incomplete or inconsistent report','Security office contact','Written request from security office','Access suspended or formal notice','Deadline concern'],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[]}},{id:'content-removal-google',slug:'content-removal-google',title:'Can This Be Removed From Google?',subtitle:'Online Content Removal Assessment',groundingNote:'',questions:[],results:[{tier:1,label:'No Significant Obstacles Identified',message:'',ctaText:'Schedule My Free Consultation',ctaType:'schedule'},{tier:2,label:'Potential Challenges Identified',message:'',ctaText:'Schedule My Free Consultation',ctaType:'schedule'},{tier:3,label:'Significant Obstacles Identified — Further Review Recommended',message:'',ctaText:'Schedule My Free Consultation',ctaType:'schedule'}],availableFlags:[],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[],customFields:[{label:'URL(s) to the content you want removed',type:'textarea',placeholder:'https://example.com/article...',required:false}]}},{id:'military-discharge-upgrade',slug:'military-discharge-upgrade',title:'Military Discharge Upgrade Assessment',subtitle:'NSLF Attorney Assessment Engine',scoringMode:'tag-collection',questions:[],results:[],availableFlags:[],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[]}}];

  <script>
const KEYS={quizzes:'ql_quizzes',responses:'ql_responses'};
const Storage={
  init(){const ex=JSON.parse(localStorage.getItem(KEYS.quizzes)||'[]');const exMap=new Map(ex.map(q=>[q.id,q]));const merged=SEED_QUIZZES.map(seed=>{const stored=exMap.get(seed.id);if(!stored)return seed;if(seed.version&&(!stored.version||seed.version>stored.version))return seed;return stored;});const seedIds=new Set(SEED_QUIZZES.map(q=>q.id));const user=ex.filter(q=>!seedIds.has(q.id));localStorage.setItem(KEYS.quizzes,JSON.stringify([...merged,...user]));},
  getQuizzes(){return JSON.parse(localStorage.getItem(KEYS.quizzes)||'[]');},
  getQuiz(id){return this.getQuizzes().find(q=>q.id===id||q.slug===id)||null;},
  saveQuiz(quiz){const qs=this.getQuizzes();const i=qs.findIndex(q=>q.id===quiz.id);if(i>=0)qs[i]=quiz;else qs.push(quiz);localStorage.setItem(KEYS.quizzes,JSON.stringify(qs));},
  deleteQuiz(id){localStorage.setItem(KEYS.quizzes,JSON.stringify(this.getQuizzes().filter(q=>q.id!==id)));},
  getResponses(){return JSON.parse(localStorage.getItem(KEYS.responses)||'[]');},
  saveResponse(r){const rs=this.getResponses();rs.unshift(r);localStorage.setItem(KEYS.responses,JSON.stringify(rs));},
  deleteResponse(id){localStorage.setItem(KEYS.responses,JSON.stringify(this.getResponses().filter(r=>r.id!==id)));},
  clearResponses(){localStorage.setItem(KEYS.responses,'[]');},
  scoreAnswers(quiz,opts){let max=1;const flags=[];for(const o of opts){if(o.tier>max)max=o.tier;for(const f of o.flags)if(!flags.includes(f))flags.push(f);}return{tier:max,result:quiz.results.find(r=>r.tier===max),flags:flags.slice(0,3)};},
  generateId(){return'id_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36);}
};
  </script>
  <script>
    let allResponses = [];
    let allQuizzes   = [];

    function init() {
      Storage.init();
      allResponses = Storage.getResponses();
      allQuizzes   = Storage.getQuizzes();

      // Populate quiz filter
      const quizSel = document.getElementById('filter-quiz');
      const seen = new Set();
      for (const r of allResponses) {
        if (!seen.has(r.quizId)) {
          seen.add(r.quizId);
          const opt = document.createElement('option');
          opt.value = r.quizId;
          opt.textContent = r.quizTitle;
          quizSel.appendChild(opt);
        }
      }

      renderStats(allResponses);
      renderTable(allResponses);
    }

    function applyFilters() {
      const quizFilter = document.getElementById('filter-quiz').value;
      const tierFilter = document.getElementById('filter-tier').value;
      let filtered = allResponses;
      if (quizFilter) filtered = filtered.filter(r => r.quizId === quizFilter);
      if (tierFilter === 'null') filtered = filtered.filter(r => r.resultTier == null);
      else if (tierFilter) filtered = filtered.filter(r => String(r.resultTier) === tierFilter);
      renderTable(filtered);
    }

    function renderStats(responses) {
      const total = responses.length;

      const quizCounts = {};
      for (const r of responses) {
        if (!quizCounts[r.quizId]) quizCounts[r.quizId] = { title: r.quizTitle || r.quizId, count: 0 };
        quizCounts[r.quizId].count++;
      }

      const quizCards = Object.values(quizCounts).map(q => `
        <div class="stat-card">
          <div class="stat-value">${q.count}</div>
          <div class="stat-label">${escHtml(q.title)}</div>
        </div>`).join('');

      document.getElementById('stats-row').innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${total}</div>
          <div class="stat-label">Total responses</div>
        </div>
        ${quizCards}`;
    }

    function renderTable(responses) {
      const tbody = document.getElementById('responses-tbody');

      if (!responses.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No responses yet. Share a quiz link to start collecting leads.</td></tr>';
        return;
      }

      tbody.innerHTML = responses.map(r => {
        const lc = r.leadCapture || {};
        const date = new Date(r.timestamp);
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const quiz = allQuizzes.find(q => q.id === r.quizId);
        const flagLib = (quiz && quiz.availableFlags) || [];
        const flags = (r.triggeredFlags || []).slice(0, 3).map(fId => {
          const def = Array.isArray(flagLib) && flagLib.find(f => f.id === fId);
          return (def && def.label) ? def.label : fId;
        });

        return `
          <tr>
            <td class="td-date">${dateStr}<br><span style="font-size:0.75rem">${timeStr}</span></td>
            <td>${escHtml(r.quizTitle || r.quizId)}</td>
            <td>
              ${r.resultTier != null
                ? `<span class="tier-badge tier-${r.resultTier}">Tier ${r.resultTier}</span>`
                : `<span class="tier-badge" style="background:#f1f5f9;color:var(--text-2);border-color:var(--border-md);">Assessment</span>`
              }
              <div style="font-size:0.78rem;color:var(--text-2);margin-top:0.25rem;max-width:160px;">${escHtml(r.resultLabel || '')}</div>
            </td>
            <td>
              <div class="td-flags">${flags.map(f => `<span class="tag">${escHtml(f)}</span>`).join('')}</div>
            </td>
            <td class="td-name">${escHtml(lc.name || '—')}</td>
            <td>${lc.email ? `<a href="mailto:${encodeURIComponent(lc.email)}" style="color:var(--blue)">${escHtml(lc.email)}</a>` : '—'}</td>
            <td style="white-space:nowrap;">
              <button class="view-btn" onclick="viewResponse('${escHtml(r.id)}')">View</button>
              <button class="del-btn" title="Delete" onclick="deleteRow('${escHtml(r.id)}')">✕</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function deleteRow(id) {
      if (!confirm('Delete this response?')) return;
      Storage.deleteResponse(id);
      allResponses = Storage.getResponses();
      renderStats(allResponses);
      applyFilters();
    }

    function clearAll() {
      if (!confirm('Delete ALL responses? This cannot be undone.')) return;
      Storage.clearResponses();
      allResponses = [];
      document.getElementById('filter-quiz').value = '';
      document.getElementById('filter-tier').value = '';
      renderStats([]);
      renderTable([]);
    }

    function exportCsv() {
      const quizFilter = document.getElementById('filter-quiz').value;
      const tierFilter = document.getElementById('filter-tier').value;
      let rows = allResponses;
      if (quizFilter) rows = rows.filter(r => r.quizId === quizFilter);
      if (tierFilter) rows = rows.filter(r => String(r.resultTier) === tierFilter);

      const headers = ['Date','Time','Quiz','Result Tier','Result Label','Flags','Name','Email','Phone','Deadline','Issue Type'];
      const csvRows = [headers.join(',')];

      for (const r of rows) {
        const lc = r.leadCapture || {};
        const d = new Date(r.timestamp);
        const cells = [
          d.toLocaleDateString('en-US'),
          d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
          r.quizTitle || r.quizId,
          r.resultTier,
          r.resultLabel || '',
          (r.triggeredFlags || []).join('; '),
          lc.name || '',
          lc.email || '',
          lc.phone || '',
          lc.deadline || '',
          lc.issueType || '',
        ].map(v => `"${String(v).replace(/"/g,'""')}"`);
        csvRows.push(cells.join(','));
      }

      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quiz-responses-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function viewResponse(id) {
      const r = allResponses.find(x => x.id === id);
      if (!r) return;

      const lc = r.leadCapture || {};
      const date = new Date(r.timestamp);
      const dateStr = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) +
                      ' at ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      document.getElementById('drawer-title').textContent = r.quizTitle || r.quizId;
      document.getElementById('drawer-meta').textContent = dateStr;

      // ── Result section ──
      const resultBadge = r.resultTier != null
        ? `<span class="tier-badge tier-${r.resultTier}">Tier ${r.resultTier}</span>`
        : `<span class="tier-badge" style="background:#f1f5f9;color:var(--text-2);border-color:var(--border-md);">Assessment</span>`;
      let resultHtml = `<div style="margin-bottom:0.5rem;">${resultBadge} <span style="font-size:0.875rem;font-weight:500;">${escHtml(r.resultLabel || '')}</span></div>`;

      // Collected tags (attorney assessment)
      if (r.collectedTags && r.collectedTags.length) {
        const quiz = allQuizzes.find(q => q.id === r.quizId);
        const lib = (quiz && quiz.tagLibrary) || {};
        const grouped = { theories: [], strengths: [], challenges: [], relief: [] };
        const catLabel = { theories: 'Legal Theories', strengths: 'Strengths', challenges: 'Challenges', relief: 'Relief Options' };
        for (const tagId of r.collectedTags) {
          const tag = lib[tagId];
          if (tag && grouped[tag.category]) grouped[tag.category].push(tag.label || tagId);
        }
        resultHtml += Object.entries(grouped).filter(([,v]) => v.length).map(([cat, tags]) => `
          <div class="tag-group-label">${catLabel[cat]}</div>
          <div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
            ${tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
          </div>`).join('');
      }

      // Triggered flags (tier-based) — resolve labels from quiz tag library
      if ((r.triggeredFlags || []).length) {
        const quiz = allQuizzes.find(q => q.id === r.quizId);
        const flagLib = (quiz && quiz.availableFlags) || [];
        const flagPills = r.triggeredFlags.map(fId => {
          const def = Array.isArray(flagLib) && flagLib.find(f => f.id === fId);
          const label = (def && def.label) ? def.label : fId;
          return `<span class="tag">${escHtml(label)}</span>`;
        }).join(' ');
        resultHtml += `<div style="margin-top:0.4rem;">${flagPills}</div>`;
      }

      // ── Contact section ──
      const STANDARD = new Set(['name','email','phone','deadline','issueType']);
      const contactRows = [
        ['Name',     lc.name],
        ['Email',    lc.email],
        ['Phone',    lc.phone],
        ['Deadline', lc.deadline],
        ['Issue type', lc.issueType],
        ...Object.entries(lc).filter(([k, v]) => !STANDARD.has(k) && v),
      ].filter(([, v]) => v).map(([k, v]) =>
        `<tr>
          <td class="dl-label dl-table">${escHtml(k)}</td>
          <td class="dl-value">${k.toLowerCase().includes('email')
            ? `<a href="mailto:${encodeURIComponent(v)}" style="color:var(--blue)">${escHtml(v)}</a>`
            : escHtml(v)}</td>
        </tr>`
      ).join('');

      // ── Answers section ──
      const grouped = {};
      for (const a of (r.answers || [])) {
        if (!grouped[a.questionId]) grouped[a.questionId] = { text: a.questionText, answers: [] };
        grouped[a.questionId].answers.push(a.optionText);
      }
      const answersHtml = Object.values(grouped).map(g => `
        <div class="qa-item">
          <div class="qa-q">${escHtml(g.text)}</div>
          <div class="qa-a">${g.answers.map(a => escHtml(a)).join('<br>')}</div>
        </div>`).join('');

      document.getElementById('drawer-body').innerHTML = `
        <div class="drawer-section">
          <div class="drawer-section-title">Result</div>
          ${resultHtml}
        </div>
        <div class="drawer-section">
          <div class="drawer-section-title">Contact Information</div>
          <table class="dl-table">${contactRows || '<tr><td colspan="2" style="color:var(--text-3)">No contact info recorded</td></tr>'}</table>
        </div>
        ${answersHtml ? `
        <div class="drawer-section">
          <div class="drawer-section-title">Quiz Answers</div>
          ${answersHtml}
        </div>` : ''}
      `;

      document.getElementById('response-drawer').classList.remove('hidden');
    }

    function closeDrawer(e) {
      if (e.target === document.getElementById('response-drawer')) {
        document.getElementById('response-drawer').classList.add('hidden');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.getElementById('response-drawer').classList.add('hidden');
    });

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>
