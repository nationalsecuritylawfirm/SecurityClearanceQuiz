<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Clearance Quiz</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/api.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--navy); line-height: 1.2; }
    .stat-label { font-size: 0.78rem; color: var(--text-3); margin-top: 0.2rem; }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .filter-bar select { width: auto; flex: 1; min-width: 150px; max-width: 220px; }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    thead { background: var(--bg); }
    th {
      text-align: left;
      padding: 0.65rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .td-flags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .td-name  { font-weight: 500; }
    .td-date  { color: var(--text-3); white-space: nowrap; font-size: 0.8rem; }

    .empty-row td {
      text-align: center;
      padding: 3rem;
      color: var(--text-3);
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      line-height: 1;
    }
    .del-btn:hover { color: #dc2626; background: #fef2f2; }

    .actions-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    /* ── Detail drawer ── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.4);
      z-index: 200;
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
    }
    .drawer-panel {
      background: white;
      width: 480px;
      max-width: 100vw;
      height: 100%;
      overflow-y: auto;
      box-shadow: -4px 0 32px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }
    .drawer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: white;
      z-index: 1;
    }
    .drawer-title { font-size: 1rem; font-weight: 700; color: var(--navy); line-height: 1.4; }
    .drawer-meta  { font-size: 0.8rem; color: var(--text-3); margin-top: 0.2rem; }
    .drawer-close {
      background: none; border: none; font-size: 1.3rem; color: var(--text-3);
      cursor: pointer; padding: 0 0.25rem; line-height: 1; flex-shrink: 0; margin-left: 1rem;
    }
    .drawer-close:hover { color: var(--text); }
    .drawer-body { padding: 1.25rem 1.5rem; flex: 1; }
    .drawer-section { margin-bottom: 1.75rem; }
    .drawer-section-title {
      font-size: 0.7rem; font-weight: 700; color: var(--text-3); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 0.65rem;
      padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    }
    .dl-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .dl-table td { padding: 0.45rem 0; vertical-align: top; border-bottom: 1px solid var(--border); }
    .dl-table tr:last-child td { border-bottom: none; }
    .dl-label { color: var(--text-2); width: 150px; padding-right: 0.75rem; flex-shrink: 0; }
    .dl-value  { color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .qa-item   { margin-bottom: 0.9rem; }
    .qa-q { font-size: 0.78rem; color: var(--text-3); margin-bottom: 0.2rem; }
    .qa-a { font-size: 0.875rem; color: var(--text); font-weight: 500; }
    .tag-group-label {
      font-size: 0.72rem; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; margin-top: 0.75rem;
    }
    .tag-group-label:first-child { margin-top: 0; }

    .view-btn {
      background: none; border: none; color: var(--blue);
      cursor: pointer; font-size: 0.8rem; font-weight: 500;
      padding: 0.2rem 0.45rem; border-radius: 4px; line-height: 1; margin-right: 0.2rem;
    }
    .view-btn:hover { background: var(--t2-bg); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="index.html">Clearance Quiz</a>
    <div class="navbar-links">
      <a class="navbar-link" href="index.html">Quizzes</a>
      <a class="navbar-link active" href="admin.html">Analytics</a>
      <a class="navbar-link" href="builder.html">Builder</a>
    </div>
  </nav>

  <!-- Auth gate: data renders only after Google sign-in (deploy-plan/02) -->
  <div id="auth-gate" style="max-width:420px;margin:0 auto;padding:10vh 1.25rem 4rem;text-align:center;">
    <h1 style="color:var(--navy);margin-bottom:0.4rem;">Staff sign-in</h1>
    <p class="text-muted" style="margin-bottom:1.5rem;">This page is for authorized staff. Sign in with your Google account.</p>
    <div id="gsi-button" style="display:flex;justify-content:center;"></div>
    <p id="auth-message" style="margin-top:1rem;font-size:0.875rem;color:#dc2626;min-height:1.3em;"></p>
  </div>

  <div class="page-wide hidden" id="app-main">
    <div class="flex-between" style="margin-bottom:1.5rem;flex-wrap:wrap;gap:0.75rem;">
      <div>
        <h1 style="color:var(--navy)">Analytics</h1>
        <p class="text-muted mt-1">All quiz responses — stored locally in this browser.</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Filter + export bar -->
    <div class="actions-bar">
      <div class="filter-bar" style="margin:0;flex:1;">
        <select id="filter-quiz" onchange="applyFilters()">
          <option value="">All quizzes</option>
        </select>
        <select id="filter-tier" onchange="applyFilters()">
          <option value="">All results</option>
          <option value="5">Tier 5</option>
          <option value="4">Tier 4</option>
          <option value="3">Tier 3</option>
          <option value="2">Tier 2</option>
          <option value="1">Tier 1</option>
          <option value="null">Assessment (no tier)</option>
        </select>
      </div>
      <button class="btn btn-outline btn-sm" onclick="exportCsv()">Export CSV</button>
      <button class="btn btn-danger btn-sm" onclick="clearAll()">Clear All</button>
    </div>

    <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Quiz</th>
              <th>Result</th>
              <th>Flags</th>
              <th>Name</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="responses-tbody">
            <tr class="empty-row"><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
    </div>
  </div>

  <!-- Response detail drawer -->
  <div id="response-drawer" class="drawer-overlay hidden" onclick="closeDrawer(event)">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <div class="drawer-title" id="drawer-title"></div>
          <div class="drawer-meta" id="drawer-meta"></div>
        </div>
        <button class="drawer-close" onclick="document.getElementById('response-drawer').classList.add('hidden')">×</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <script src="js/seed.js"></script>
  <script src="js/storage.js"></script>
  <script>
    let allResponses = [];
    let allQuizzes   = [];

    function init() {
      Storage.init();
      allResponses = Storage.getResponses();
      allQuizzes   = Storage.getQuizzes();

      // Populate quiz filter
      const quizSel = document.getElementById('filter-quiz');
      const seen = new Set();
      for (const r of allResponses) {
        if (!seen.has(r.quizId)) {
          seen.add(r.quizId);
          const opt = document.createElement('option');
          opt.value = r.quizId;
          opt.textContent = r.quizTitle;
          quizSel.appendChild(opt);
        }
      }

      renderStats(allResponses);
      renderTable(allResponses);
    }

    function applyFilters() {
      const quizFilter = document.getElementById('filter-quiz').value;
      const tierFilter = document.getElementById('filter-tier').value;
      let filtered = allResponses;
      if (quizFilter) filtered = filtered.filter(r => r.quizId === quizFilter);
      if (tierFilter === 'null') filtered = filtered.filter(r => r.resultTier == null);
      else if (tierFilter) filtered = filtered.filter(r => String(r.resultTier) === tierFilter);
      renderTable(filtered);
    }

    function renderStats(responses) {
      const total = responses.length;

      const quizCounts = {};
      for (const r of responses) {
        if (!quizCounts[r.quizId]) quizCounts[r.quizId] = { title: r.quizTitle || r.quizId, count: 0 };
        quizCounts[r.quizId].count++;
      }

      const quizCards = Object.values(quizCounts).map(q => `
        <div class="stat-card">
          <div class="stat-value">${q.count}</div>
          <div class="stat-label">${escHtml(q.title)}</div>
        </div>`).join('');

      document.getElementById('stats-row').innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${total}</div>
          <div class="stat-label">Total responses</div>
        </div>
        ${quizCards}`;
    }

    function renderTable(responses) {
      const tbody = document.getElementById('responses-tbody');

      if (!responses.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No responses yet. Share a quiz link to start collecting leads.</td></tr>';
        return;
      }

      tbody.innerHTML = responses.map(r => {
        const lc = r.leadCapture || {};
        const date = new Date(r.timestamp);
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const timeStr = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const quiz = allQuizzes.find(q => q.id === r.quizId);
        const flagLib = (quiz && quiz.availableFlags) || [];
        const flags = (r.triggeredFlags || []).slice(0, 3).map(fId => {
          const def = Array.isArray(flagLib) && flagLib.find(f => f.id === fId);
          return (def && def.label) ? def.label : fId;
        });

        return `
          <tr>
            <td class="td-date">${dateStr}<br><span style="font-size:0.75rem">${timeStr}</span></td>
            <td>${escHtml(r.quizTitle || r.quizId)}</td>
            <td>
              ${r.resultTier != null
                ? `<span class="tier-badge tier-${r.resultTier}">Tier ${r.resultTier}</span>`
                : `<span class="tier-badge" style="background:#f1f5f9;color:var(--text-2);border-color:var(--border-md);">Assessment</span>`
              }
              <div style="font-size:0.78rem;color:var(--text-2);margin-top:0.25rem;max-width:160px;">${escHtml(r.resultLabel || '')}</div>
            </td>
            <td>
              <div class="td-flags">${flags.map(f => `<span class="tag">${escHtml(f)}</span>`).join('')}</div>
            </td>
            <td class="td-name">${escHtml(lc.name || '—')}</td>
            <td>${lc.email ? `<a href="mailto:${encodeURIComponent(lc.email)}" style="color:var(--blue)">${escHtml(lc.email)}</a>` : '—'}</td>
            <td style="white-space:nowrap;">
              <button class="view-btn" onclick="viewResponse('${escHtml(r.id)}')">View</button>
              <button class="del-btn" title="Delete" onclick="deleteRow('${escHtml(r.id)}')">✕</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function deleteRow(id) {
      if (!confirm('Delete this response?')) return;
      Storage.deleteResponse(id);
      allResponses = Storage.getResponses();
      renderStats(allResponses);
      applyFilters();
    }

    function clearAll() {
      if (!confirm('Delete ALL responses? This cannot be undone.')) return;
      Storage.clearResponses();
      allResponses = [];
      document.getElementById('filter-quiz').value = '';
      document.getElementById('filter-tier').value = '';
      renderStats([]);
      renderTable([]);
    }

    function exportCsv() {
      const quizFilter = document.getElementById('filter-quiz').value;
      const tierFilter = document.getElementById('filter-tier').value;
      let rows = allResponses;
      if (quizFilter) rows = rows.filter(r => r.quizId === quizFilter);
      if (tierFilter) rows = rows.filter(r => String(r.resultTier) === tierFilter);

      const headers = ['Date','Time','Quiz','Result Tier','Result Label','Flags','Name','Email','Phone','Deadline','Issue Type'];
      const csvRows = [headers.join(',')];

      for (const r of rows) {
        const lc = r.leadCapture || {};
        const d = new Date(r.timestamp);
        const cells = [
          d.toLocaleDateString('en-US'),
          d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
          r.quizTitle || r.quizId,
          r.resultTier,
          r.resultLabel || '',
          (r.triggeredFlags || []).join('; '),
          lc.name || '',
          lc.email || '',
          lc.phone || '',
          lc.deadline || '',
          lc.issueType || '',
        ].map(v => `"${String(v).replace(/"/g,'""')}"`);
        csvRows.push(cells.join(','));
      }

      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quiz-responses-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function viewResponse(id) {
      const r = allResponses.find(x => x.id === id);
      if (!r) return;

      const lc = r.leadCapture || {};
      const date = new Date(r.timestamp);
      const dateStr = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) +
                      ' at ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      document.getElementById('drawer-title').textContent = r.quizTitle || r.quizId;
      document.getElementById('drawer-meta').textContent = dateStr;

      // ── Result section ──
      const resultBadge = r.resultTier != null
        ? `<span class="tier-badge tier-${r.resultTier}">Tier ${r.resultTier}</span>`
        : `<span class="tier-badge" style="background:#f1f5f9;color:var(--text-2);border-color:var(--border-md);">Assessment</span>`;
      let resultHtml = `<div style="margin-bottom:0.5rem;">${resultBadge} <span style="font-size:0.875rem;font-weight:500;">${escHtml(r.resultLabel || '')}</span></div>`;

      // Collected tags (attorney assessment)
      if (r.collectedTags && r.collectedTags.length) {
        const quiz = allQuizzes.find(q => q.id === r.quizId);
        const lib = (quiz && quiz.tagLibrary) || {};
        const grouped = { theories: [], strengths: [], challenges: [], relief: [] };
        const catLabel = { theories: 'Legal Theories', strengths: 'Strengths', challenges: 'Challenges', relief: 'Relief Options' };
        for (const tagId of r.collectedTags) {
          const tag = lib[tagId];
          if (tag && grouped[tag.category]) grouped[tag.category].push(tag.label || tagId);
        }
        resultHtml += Object.entries(grouped).filter(([,v]) => v.length).map(([cat, tags]) => `
          <div class="tag-group-label">${catLabel[cat]}</div>
          <div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
            ${tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
          </div>`).join('');
      }

      // Triggered flags (tier-based) — resolve labels from quiz tag library
      if ((r.triggeredFlags || []).length) {
        const quiz = allQuizzes.find(q => q.id === r.quizId);
        const flagLib = (quiz && quiz.availableFlags) || [];
        const flagPills = r.triggeredFlags.map(fId => {
          const def = Array.isArray(flagLib) && flagLib.find(f => f.id === fId);
          const label = (def && def.label) ? def.label : fId;
          return `<span class="tag">${escHtml(label)}</span>`;
        }).join(' ');
        resultHtml += `<div style="margin-top:0.4rem;">${flagPills}</div>`;
      }

      // ── Contact section ──
      const STANDARD = new Set(['name','email','phone','deadline','issueType']);
      const contactRows = [
        ['Name',     lc.name],
        ['Email',    lc.email],
        ['Phone',    lc.phone],
        ['Deadline', lc.deadline],
        ['Issue type', lc.issueType],
        ...Object.entries(lc).filter(([k, v]) => !STANDARD.has(k) && v),
      ].filter(([, v]) => v).map(([k, v]) =>
        `<tr>
          <td class="dl-label dl-table">${escHtml(k)}</td>
          <td class="dl-value">${k.toLowerCase().includes('email')
            ? `<a href="mailto:${encodeURIComponent(v)}" style="color:var(--blue)">${escHtml(v)}</a>`
            : escHtml(v)}</td>
        </tr>`
      ).join('');

      // ── Answers section ──
      const grouped = {};
      for (const a of (r.answers || [])) {
        if (!grouped[a.questionId]) grouped[a.questionId] = { text: a.questionText, answers: [] };
        grouped[a.questionId].answers.push(a.optionText);
      }
      const answersHtml = Object.values(grouped).map(g => `
        <div class="qa-item">
          <div class="qa-q">${escHtml(g.text)}</div>
          <div class="qa-a">${g.answers.map(a => escHtml(a)).join('<br>')}</div>
        </div>`).join('');

      document.getElementById('drawer-body').innerHTML = `
        <div class="drawer-section">
          <div class="drawer-section-title">Result</div>
          ${resultHtml}
        </div>
        <div class="drawer-section">
          <div class="drawer-section-title">Contact Information</div>
          <table class="dl-table">${contactRows || '<tr><td colspan="2" style="color:var(--text-3)">No contact info recorded</td></tr>'}</table>
        </div>
        ${answersHtml ? `
        <div class="drawer-section">
          <div class="drawer-section-title">Quiz Answers</div>
          ${answersHtml}
        </div>` : ''}
      `;

      document.getElementById('response-drawer').classList.remove('hidden');
    }

    function closeDrawer(e) {
      if (e.target === document.getElementById('response-drawer')) {
        document.getElementById('response-drawer').classList.add('hidden');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.getElementById('response-drawer').classList.add('hidden');
    });

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let appStarted = false;
    Api.initAuth({
      buttonEl: document.getElementById('gsi-button'),
      messageEl: document.getElementById('auth-message'),
      onAuthorized() {
        document.getElementById('auth-gate').classList.add('hidden');
        document.getElementById('app-main').classList.remove('hidden');
        if (!appStarted) { appStarted = true; init(); }
      },
      onSignedOut() {
        document.getElementById('app-main').classList.add('hidden');
        document.getElementById('auth-gate').classList.remove('hidden');
      },
    });
  </script>
</body>
</html>
