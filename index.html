<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Clearance Quizzes</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }
    .hero-eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 0.75rem;
    }
    .hero h1 { color: var(--navy); margin-bottom: 0.75rem; }
    .hero p   { max-width: 520px; margin: 0 auto; font-size: 1.05rem; }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .quiz-card:hover {
      border-color: var(--blue);
      box-shadow: 0 4px 16px rgba(37,99,235,0.08);
    }
    .quiz-card-icon {
      width: 40px; height: 40px;
      background: #eff6ff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .quiz-card h2 { font-size: 1.05rem; color: var(--navy); }
    .quiz-card p  { font-size: 0.875rem; flex: 1; }
    .quiz-meta {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem; color: var(--text-3);
    }
    .quiz-card a {
      display: block;
      text-align: center;
      background: var(--navy);
      color: white;
      border-radius: 7px;
      padding: 0.6rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      margin-top: 0.25rem;
      transition: background 0.15s;
    }
    .quiz-card a:hover { background: var(--navy-light); }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-3);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="index.html">Clearance Quiz</a>
    <div class="navbar-links">
      <a class="navbar-link active" href="index.html">Quizzes</a>
    </div>
  </nav>

  <div class="page-wide">
    <div class="hero">
      <div class="hero-eyebrow">Security Clearance Tools</div>
      <h1>Find Out Where You Stand</h1>
      <p>Answer a few questions to understand your situation and get a personalized recommendation.</p>
    </div>

    <div class="quiz-grid" id="quiz-grid">
      <div class="empty-state">Loading quizzes…</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const ICONS = ['📋', '💰', '🛡️', '📁', '⚖️'];

    async function init() {
      const grid = document.getElementById('quiz-grid');
      grid.innerHTML = '<div class="empty-state">Loading quizzes…</div>';

      let quizzes;
      try {
        quizzes = await Api.getQuizzes();
      } catch {
        grid.innerHTML = `<div class="empty-state">Couldn't load quizzes. Check your connection and
          <button class="btn btn-outline btn-sm" onclick="init()" style="margin-left:0.4rem;">try again</button></div>`;
        return;
      }

      if (!quizzes.length) {
        grid.innerHTML = '<div class="empty-state">No quizzes yet. Check back soon.</div>';
        return;
      }

      grid.innerHTML = quizzes.map((quiz, i) => {
        const qCount = quiz.questionCount || 0;
        const icon = ICONS[i % ICONS.length];
        return `
          <div class="quiz-card">
            <div class="quiz-card-icon">${icon}</div>
            <h2>${escHtml(quiz.title)}</h2>
            <p>${escHtml(quiz.subtitle || '')}</p>
            <div class="quiz-meta">
              <span>${qCount} question${qCount !== 1 ? 's' : ''}</span>
              <span>·</span>
              <span>~${Math.ceil(qCount * 0.5)} min</span>
            </div>
            <a href="quiz.html?id=${encodeURIComponent(quiz.slug || quiz.id)}">Take the Quiz →</a>
          </div>
        `;
      }).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    init();
  </script>
</body>
</html>
