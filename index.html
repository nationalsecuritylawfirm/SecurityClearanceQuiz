  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:#1e3a5f; --navy-light:#2a4f82; --blue:#2563eb; --blue-light:#3b82f6;
  --bg:#f8fafc; --surface:#ffffff; --border:#e2e8f0; --border-md:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --t1:#059669; --t1-bg:#ecfdf5; --t1-border:#a7f3d0;
  --t2:#2563eb; --t2-bg:#eff6ff; --t2-border:#bfdbfe;
  --t3:#d97706; --t3-bg:#fffbeb; --t3-border:#fde68a;
  --t4:#ea580c; --t4-bg:#fff7ed; --t4-border:#fed7aa;
  --t5:#dc2626; --t5-bg:#fef2f2; --t5-border:#fecaca;
}
body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
h1 { font-size:1.75rem; font-weight:700; line-height:1.25; }
h2 { font-size:1.25rem; font-weight:600; line-height:1.3; }
h3 { font-size:1rem; font-weight:600; }
p  { color:var(--text-2); }
.page { max-width:720px; margin:0 auto; padding:2rem 1.25rem 4rem; }
.page-wide { max-width:1100px; margin:0 auto; padding:2rem 1.25rem 4rem; }
.navbar { background:var(--navy); padding:0 1.5rem; display:flex; align-items:center; gap:2rem; height:56px; position:sticky; top:0; z-index:100; }
.navbar-brand { color:white; font-weight:700; font-size:1rem; text-decoration:none; letter-spacing:.01em; white-space:nowrap; }
.navbar-links { display:flex; gap:.25rem; margin-left:auto; }
.navbar-link { color:rgba(255,255,255,.75); text-decoration:none; font-size:.875rem; padding:.4rem .75rem; border-radius:6px; transition:background .15s,color .15s; }
.navbar-link:hover,.navbar-link.active { background:rgba(255,255,255,.12); color:white; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.5rem; }
.card+.card { margin-top:1rem; }
.btn { display:inline-flex; align-items:center; gap:.4rem; padding:.55rem 1.1rem; border-radius:7px; font-size:.9rem; font-weight:500; cursor:pointer; border:1px solid transparent; transition:background .15s,opacity .15s; text-decoration:none; white-space:nowrap; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-primary  { background:var(--blue); color:white; }
.btn-primary:hover:not(:disabled)  { background:#1d4ed8; }
.btn-navy     { background:var(--navy); color:white; }
.btn-navy:hover:not(:disabled)     { background:var(--navy-light); }
.btn-outline  { background:white; color:var(--text); border-color:var(--border-md); }
.btn-outline:hover:not(:disabled)  { border-color:var(--blue); color:var(--blue); }
.btn-ghost    { background:transparent; color:var(--text-2); border-color:transparent; }
.btn-ghost:hover:not(:disabled)    { background:var(--bg); }
.btn-danger   { background:white; color:#dc2626; border-color:#fecaca; }
.btn-danger:hover:not(:disabled)   { background:#fef2f2; }
.btn-sm { padding:.35rem .7rem; font-size:.8rem; }
.btn-lg { padding:.75rem 1.5rem; font-size:1rem; font-weight:600; }
.form-group { display:flex; flex-direction:column; gap:.375rem; }
.form-group+.form-group { margin-top:1rem; }
label { font-size:.875rem; font-weight:500; color:var(--text); }
input[type=text],input[type=email],input[type=tel],select,textarea { padding:.55rem .75rem; border:1px solid var(--border-md); border-radius:7px; font-size:.9rem; font-family:inherit; color:var(--text); background:white; width:100%; transition:border-color .15s,box-shadow .15s; }
input:focus,select:focus,textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
textarea { resize:vertical; min-height:80px; }
.hint { font-size:.78rem; color:var(--text-3); }
.tier-badge { display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .65rem; border-radius:999px; font-size:.78rem; font-weight:600; }
.tier-1 { background:var(--t1-bg); color:var(--t1); border:1px solid var(--t1-border); }
.tier-2 { background:var(--t2-bg); color:var(--t2); border:1px solid var(--t2-border); }
.tier-3 { background:var(--t3-bg); color:var(--t3); border:1px solid var(--t3-border); }
.tier-4 { background:var(--t4-bg); color:var(--t4); border:1px solid var(--t4-border); }
.tier-5 { background:var(--t5-bg); color:var(--t5); border:1px solid var(--t5-border); }
.result-card { border-radius:10px; padding:1.75rem; border-width:1.5px; border-style:solid; }
.result-card.tier-1 { background:var(--t1-bg); border-color:var(--t1-border); }
.result-card.tier-2 { background:var(--t2-bg); border-color:var(--t2-border); }
.result-card.tier-3 { background:var(--t3-bg); border-color:var(--t3-border); }
.result-card.tier-4 { background:var(--t4-bg); border-color:var(--t4-border); }
.result-card.tier-5 { background:var(--t5-bg); border-color:var(--t5-border); }
.tag { display:inline-block; padding:.2rem .55rem; background:var(--bg); border:1px solid var(--border); border-radius:999px; font-size:.78rem; color:var(--text-2); }
.divider { border:none; border-top:1px solid var(--border); margin:1.5rem 0; }
.text-muted { color:var(--text-3); font-size:.875rem; }
.flex { display:flex; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.gap-2{gap:.5rem}.gap-3{gap:.75rem}
.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}
.hidden { display:none !important; }
  </style>
  <style>
    .hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }
    .hero-eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 0.75rem;
    }
    .hero h1 { color: var(--navy); margin-bottom: 0.75rem; }
    .hero p   { max-width: 520px; margin: 0 auto; font-size: 1.05rem; }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .quiz-card:hover {
      border-color: var(--blue);
      box-shadow: 0 4px 16px rgba(37,99,235,0.08);
    }
    .quiz-card-icon {
      width: 40px; height: 40px;
      background: #eff6ff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .quiz-card h2 { font-size: 1.05rem; color: var(--navy); }
    .quiz-card p  { font-size: 0.875rem; flex: 1; }
    .quiz-meta {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem; color: var(--text-3);
    }
    .quiz-card a {
      display: block;
      text-align: center;
      background: var(--navy);
      color: white;
      border-radius: 7px;
      padding: 0.6rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      margin-top: 0.25rem;
      transition: background 0.15s;
    }
    .quiz-card a:hover { background: var(--navy-light); }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-3);
      font-size: 0.9rem;
    }
  </style>
</head>

  <script>
const SEED_QUIZZES=[{id:'sf86-red-flags',version:2,slug:'sf86-red-flags',title:'SF-86 Readiness Check',subtitle:'Do You Have Any Security Clearance Red Flags?',groundingNote:'',questions:[{id:'sf86-q1',order:1,text:'Where are you in the security clearance process?',options:[{id:'sf86-q1o1',text:'I have not submitted the SF-86/SF-85 yet',tier:1,flags:[]},{id:'sf86-q1o2',text:'I already submitted the SF-86/SF-85',tier:1,flags:[]},{id:'sf86-q1o3',text:'I received a Letter of Interrogatory (LOI), Statement of Reasons (SOR), denial, suspension, or revocation notice',tier:5,flags:['LOI, SOR, or formal government action']}]},{id:'sf86-q2',order:2,text:'Do you have complete residence, education, employment, foreign travel, and/or criminal record history?',options:[{id:'sf86-q2o1',text:'Yes',tier:1,flags:[]},{id:'sf86-q2o2',text:'Mostly, but I am missing some dates, supporting documents, addresses, or supervisor/contact information',tier:2,flags:['Information gaps']},{id:'sf86-q2o3',text:'I have gaps I am not sure how to explain',tier:2,flags:['Information gaps']}]},{id:'sf86-q3',order:3,text:'Do you have any foreign contacts, foreign relatives, foreign travel, dual citizenship, foreign property, or foreign financial interests?',options:[{id:'sf86-q3o1',text:'No',tier:1,flags:[]},{id:'sf86-q3o2',text:'Yes, but straightforward',tier:1,flags:[]},{id:'sf86-q3o3',text:'Yes, and I am not sure what must be listed',tier:3,tag:'foreign-concern',flags:['Foreign interests or contacts']},{id:'sf86-q3o4',text:'Yes, and the country or relationship may raise concerns',tier:3,tag:'foreign-concern',flags:['Foreign interests or contacts']}]},{id:'sf86-q4',order:4,text:'Do you have financial issues?',options:[{id:'sf86-q4o1',text:'No',tier:1,flags:[]},{id:'sf86-q4o2',text:'Past late payments, now resolved',tier:3,tag:'financial-concern',flags:['Financial issue']},{id:'sf86-q4o3',text:'Current delinquent debt',tier:3,tag:'financial-concern',flags:['Financial issue','Current delinquency']},{id:'sf86-q4o4',text:'Tax debt, collections, charge-offs, bankruptcy, wage garnishment, or foreclosure',tier:3,tag:'financial-concern',flags:['Financial issue','Tax or bankruptcy issue']},{id:'sf86-q4o5',text:'I am not sure what appears on my credit report',tier:2,flags:['Unknown credit report issue']}]},{id:'sf86-q5',order:5,text:'Any police, criminal, or court history?',options:[{id:'sf86-q5o1',text:'No',tier:1,flags:[]},{id:'sf86-q5o2',text:'Yes — older or minor issue, now resolved',tier:3,tag:'criminal-concern',flags:['Police or court history']},{id:'sf86-q5o3',text:'Yes — recent or still pending',tier:3,tag:'criminal-concern',flags:['Police or court history','Pending legal matter']},{id:'sf86-q5o4',text:'Yes — serious or sensitive matters (felony, domestic violence, restraining order, assault, firearms)',tier:3,tag:'criminal-concern',flags:['Police or court history','Serious criminal matter']},{id:'sf86-q5o5',text:"I'm not sure whether I need to disclose it",tier:4,tag:'disclosure-uncertainty',flags:['Disclosure concern']}]},{id:'sf86-q6',order:6,text:'Any drug, marijuana, CBD/delta, or controlled substance issue?',options:[{id:'sf86-q6o1',text:'No',tier:1,flags:[]},{id:'sf86-q6o2',text:'Past marijuana/THC or controlled substance use',tier:3,tag:'drug-concern',flags:['Drug or substance issue']},{id:'sf86-q6o3',text:'Recent marijuana/THC or controlled substance use',tier:3,tag:'drug-concern',flags:['Drug or substance issue']},{id:'sf86-q6o4',text:'Use while cleared or after starting the clearance process',tier:3,tag:'drug-concern',flags:['Drug use while cleared']},{id:'sf86-q6o5',text:'I am not sure how to answer',tier:4,tag:'disclosure-uncertainty',flags:['Disclosure concern']}]},{id:'sf86-q7',order:7,text:'Any alcohol-related incidents?',options:[{id:'sf86-q7o1',text:'No',tier:1,flags:[]},{id:'sf86-q7o2',text:'One older incident',tier:3,tag:'alcohol-concern',flags:['Alcohol incident']},{id:'sf86-q7o3',text:'Recent incident(s)',tier:3,tag:'alcohol-concern',flags:['Alcohol incident']},{id:'sf86-q7o4',text:'Work, school, or military alcohol issue',tier:3,tag:'alcohol-concern',flags:['Alcohol incident']},{id:'sf86-q7o5',text:'Treatment, relapse, or repeated incidents',tier:3,tag:'alcohol-concern',flags:['Alcohol or treatment issue']}]},{id:'sf86-q8',order:8,text:'Have you had a prior clearance issue?',options:[{id:'sf86-q8o1',text:'No',tier:1,flags:[]},{id:'sf86-q8o2',text:'Prior interim clearance denied',tier:3,tag:'prior-clearance-concern',flags:['Prior clearance issue']},{id:'sf86-q8o3',text:'Prior clearance denied, suspended, or revoked',tier:3,tag:'prior-clearance-concern',flags:['Prior clearance issue']},{id:'sf86-q8o4',text:'Prior SOR/LOI/interrogatories',tier:3,tag:'prior-clearance-concern',flags:['Prior clearance issue']},{id:'sf86-q8o5',text:'I previously omitted or misstated something',tier:4,tag:'omission-concern',flags:['Disclosure concern','Prior omission or misstatement']}]},{id:'sf86-q9',order:9,text:'Are you worried about inconsistent, incomplete, or inaccurate answers?',options:[{id:'sf86-q9o1',text:'No',tier:1,flags:[]},{id:'sf86-q9o2',text:'Maybe',tier:4,flags:['Disclosure concern']},{id:'sf86-q9o3',text:'Yes, I omitted something',tier:4,tag:'omission-concern',flags:['Disclosure concern','Omission']},{id:'sf86-q9o4',text:'Yes, I gave different information before',tier:4,tag:'inconsistency-concern',flags:['Disclosure concern','Inconsistent information']},{id:'sf86-q9o5',text:'Yes, I already submitted and need to correct something',tier:4,tag:'correction-needed',flags:['Disclosure concern','Correction needed']}]}],results:[{tier:1,label:'Ready to Submit — Keep It Accurate',forPeopleWith:'Complete history, no major issues, and no inconsistency concerns.',message:'Your answers suggest you may be in a good position to continue preparing your questionnaire. The most important next step is accuracy: make sure dates, addresses, contacts, and explanations are complete before submission.',ctaText:'Download the SF-86 final review checklist',ctaType:'download',tags:[]},{tier:2,label:'Information Gaps — Gather Details Before Submitting',forPeopleWith:'People missing dates, addresses, employment details, foreign travel details, supervisor contacts, or court records.',message:'Your answers suggest the biggest issue may not be a legal red flag, but missing or incomplete information. Before submitting, gather documents and clarify gaps so your answers are consistent and complete.',ctaText:'Get the SF-86 document checklist',ctaType:'download',tags:[]},{tier:3,label:'Potential Red Flags — Explanation May Matter',forPeopleWith:'People with debt, foreign contacts, drug use, alcohol issues, police history, or similar concerns.',message:'Your answers suggest one or more areas may require careful explanation. A red flag does not automatically mean denial, but the way you disclose, explain, and document the issue can matter.',ctaText:'Schedule a pre-submission clearance consultation',ctaType:'schedule',tags:[{id:'foreign-concern',label:'Foreign Contacts, Travel, or Interests',message:'Foreign contacts, travel, and financial interests must be disclosed on the SF-86 — not because having them creates a disqualification, but because incomplete or inconsistent disclosure can create a larger problem than the underlying relationship or trip. Every foreign national contact, foreign travel, foreign financial account, dual citizenship, property, and business interest must be accurately reported under the applicable questions. If you are unsure what to include, err toward disclosure — the consequences of omitting a foreign contact are generally more serious than including a benign one.'},{id:'financial-concern',label:'Financial Issue',message:'Financial problems are among the most common — and most manageable — issues in security clearance investigations, provided they are disclosed accurately, explained clearly, and supported by documentation of the steps you have taken. Investigators consider the cause of the problem, the current status, and the trend: whether you are addressing the issue matters more than whether the issue exists. Organize your records, document your mitigation plan, and prepare to explain the circumstances consistently with your credit report, tax records, and any court documents.'},{id:'criminal-concern',label:'Police, Court, or Criminal History',message:'Criminal history — including arrests, charges, DUIs, summons, restraining orders, and court appearances — must generally be disclosed on the SF-86 regardless of how the case was resolved, whether the charges were dropped, or whether the record was later expunged. The disclosure obligation runs from the date of the event, not the date of final disposition. Incomplete or inconsistent disclosure of criminal history is often treated more seriously than the underlying incident. Gather the complete record: the arrest report, the docket, the disposition, and any expungement or sealing order.'},{id:'drug-concern',label:'Drug or Substance Issue',message:'Drug use — including marijuana, THC products, CBD/delta products from unregulated sources, and other controlled substances — is a disclosable issue on the SF-86. For active clearance holders, use after starting the clearance process is treated more seriously than historical use. For applicants, the key factors are recency, frequency, and whether the use has stopped. If you are unsure how a particular substance or circumstance should be described, consult an attorney before submitting — an inconsistent or inaccurate disclosure can create a larger problem than the use itself.'},{id:'alcohol-concern',label:'Alcohol-Related Incident or Treatment',message:'Alcohol-related incidents — including DUIs, DWIs, public intoxication, alcohol-related employment or military problems, and treatment history — are disclosable on the SF-86. A single isolated incident that is old and resolved is usually addressed with an accurate disclosure and a clear explanation. Repeated incidents, recent incidents, treatment history, or work-related alcohol problems require more careful handling. Gather the full record of each incident and any treatment documentation, and be prepared to explain what has changed.'},{id:'prior-clearance-concern',label:'Prior Clearance Issue',message:'A prior clearance denial, suspension, revocation, interim denial, or SOR/LOI is a significant factor in a new clearance application — but it does not automatically prevent approval. What matters is how the prior action was handled, what the underlying issue was, whether it has been resolved, and what has changed since. Investigators will look closely at whether you disclosed the prior action accurately and completely. Gather the full documentation: the original notice, any appeal or response you submitted, and records showing what has changed since the prior action.'}]},{tier:4,label:'Disclosure Accuracy Concern — Be Careful Before Submitting, Updating, or Correcting',forPeopleWith:'People who already submitted, omitted something, gave inconsistent information, or are worried they answered incorrectly.',message:'Your answers suggest the issue may involve disclosure accuracy, consistency, or completeness. Before submitting, updating, or correcting prior answers, consider getting advice on how to explain the issue clearly and accurately.',ctaText:'Speak with a clearance attorney before submitting a correction',ctaType:'contact',tags:[{id:'disclosure-uncertainty',label:'Not Sure Whether to Disclose',message:'When the answer to a disclosure question is uncertain, the safer choice is almost always to disclose and explain rather than omit and hope the question does not apply. SF-86 questions are broadly written — they are designed to capture more rather than less. If you have any doubt about whether a particular event, contact, charge, or issue falls within a question\'s scope, document it and include an accurate, brief explanation. Consult an attorney before submitting if the uncertainty involves a criminal matter, a foreign contact, or a drug or alcohol issue.'},{id:'omission-concern',label:'Omission or Prior Misstatement',message:'Omitting information from the SF-86 — even unintentionally — can raise a candor concern that is treated more seriously than the underlying issue. Before submitting any correction or supplement, understand exactly what was originally submitted, identify the specific gap or error, and determine whether the omission appears inadvertent or part of a pattern. The timing and manner of a correction matters significantly: a voluntary, well-explained correction submitted before an investigator raises the issue is treated very differently from one submitted in response to a direct question. Consult an attorney before supplementing or correcting a prior submission.'},{id:'inconsistency-concern',label:'Inconsistent Prior Answer',message:'If your current answers differ from information you previously provided — on a prior SF-86, in an investigator interview, or on other government forms — the discrepancy will likely be identified and may be treated as a candor concern. Before submitting, identify the specific inconsistency, determine its cause (changed facts, better recollection, or a prior error), and prepare a clear, documented explanation. Inconsistencies between current and prior submissions are one of the most common grounds for adverse clearance determinations — and one of the most preventable.'},{id:'correction-needed',label:'Submitted — Correction May Be Needed',message:'If you have already submitted an SF-86 and recognized something that should be corrected, the timing of the correction matters. Contacting the investigator or your FSO promptly to provide accurate information is generally treated as cooperative and favorable. Waiting until the issue is raised by the investigator is treated differently. An attorney can help you identify the best approach — whether that is a supplemental statement, direct communication with the investigator, or a correction through your security officer — and frame the correction in a way that minimizes additional risk.'}]},{tier:5,label:'Government Action — High Urgency',forPeopleWith:'People who received an LOI, SOR, interrogatories, suspension, revocation, denial, or hearing notice.',message:'Your answers suggest the matter may already be in a response or appeal stage. The next step is to identify the document type, agency, allegations, and evidence before submitting anything.',ctaText:'Request an urgent case review',ctaType:'contact',tags:[]}],availableFlags:['Information gaps','Foreign interests or contacts','Financial issue','Current delinquency','Tax or bankruptcy issue','Unknown credit report issue','Police or court history','Pending legal matter','Serious criminal matter','Drug or substance issue','Drug use while cleared','Alcohol incident','Alcohol or treatment issue','Prior clearance issue','Disclosure concern','Prior omission or misstatement','Omission','Inconsistent information','Correction needed','LOI, SOR, or formal government action'],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[]}},{id:'debt-taxes-clearance-risk',version:2,slug:'debt-taxes-clearance-risk',title:'Debt, Taxes & Security Clearance Risk Check',subtitle:'Could Your Financial Issue Affect Your Clearance?',groundingNote:"Financial considerations are a recognized security clearance adjudicative area. CDSE's Guideline F training explains that failure to satisfy debts or meet financial obligations can raise concerns, but it also emphasizes that the cause of the debt and the action taken to resolve it can matter more than the raw amount.",questions:[{id:'dt-q1',order:1,text:'Where are you in the security clearance or public trust process?',options:[{id:'dt-q1o1',text:'I have not submitted the SF-86/SF-85/SF-85P yet',tier:1,flags:[]},{id:'dt-q1o2',text:'I already submitted and/or have an investigator interview coming up',tier:1,flags:[]},{id:'dt-q1o3',text:'I currently hold a clearance, public trust, or sensitive position',tier:1,flags:[]}]},{id:'dt-q2',order:2,text:'What financial issue are you most concerned about?',options:[{id:'dt-q2o1',text:'No specific financial issue — I am just checking',tier:1,flags:[]},{id:'dt-q2o2',text:'Debt, late payments, collections, charge-offs, or unpaid loans',tier:3,flags:['Financial issue','Debt or collections']},{id:'dt-q2o3',text:'Tax debt, unfiled taxes, IRS issue, or state tax issue',tier:3,tag:'tax-issue',flags:['Financial issue','Tax issue']},{id:'dt-q2o4',text:'Bankruptcy, judgment, lien, garnishment, foreclosure, repossession, or eviction',tier:3,tag:'bankruptcy-judgment',flags:['Financial issue','Bankruptcy or judgment']},{id:'dt-q2o5',text:'Gambling, unexplained income/assets, business debt, or multiple financial issues',tier:3,tag:'gambling-unexplained',flags:['Financial issue','Gambling or unexplained assets']}]},{id:'dt-q3',order:3,text:'What is the current status of the issue?',options:[{id:'dt-q3o1',text:'There is no financial issue',tier:1,flags:[]},{id:'dt-q3o2',text:'Resolved, paid, discharged, settled, or no longer delinquent',tier:3,flags:['Resolved financial issue']},{id:'dt-q3o3',text:'I am on a payment plan, tax agreement, credit counseling plan, or repayment schedule',tier:3,flags:['Payment plan or tax agreement']},{id:'dt-q3o4',text:'It is still delinquent, unpaid, unresolved, or I do not have a plan yet',tier:4,tag:'active-delinquency',flags:['Active financial concern','Current delinquency']},{id:'dt-q3o5',text:'There is active legal or collection action (lawsuit, judgment, garnishment, lien, foreclosure, eviction, or levy)',tier:4,tag:'active-legal-action',flags:['Active financial concern','Active legal or collection action']}]},{id:'dt-q4',order:4,text:'What caused the financial issue?',options:[{id:'dt-q4o1',text:'There is no financial issue',tier:1,flags:[]},{id:'dt-q4o2',text:'Job loss, medical issue, divorce/separation, family emergency, business downturn, or another hardship',tier:3,flags:['Financial hardship']},{id:'dt-q4o3',text:'Missed payments, budgeting problems, overspending, or repeated late payments',tier:4,tag:'pattern-concern',flags:['Financial issue','Repeated financial problems']},{id:'dt-q4o4',text:'Tax filing/payment problem, accounting issue, or confusion about what was owed',tier:3,flags:['Tax issue']},{id:'dt-q4o5',text:'Gambling, unexplained income/assets, or I am not sure how to explain it',tier:4,tag:'gambling-risk',flags:['Gambling or unexplained assets']}]},{id:'dt-q5',order:5,text:'What steps have you taken to address it?',options:[{id:'dt-q5o1',text:'No financial issue to address',tier:1,flags:[]},{id:'dt-q5o2',text:'Paid, resolved, settled, discharged, or corrected it',tier:3,flags:['Resolved financial issue']},{id:'dt-q5o3',text:'Set up a payment plan, tax agreement, credit counseling, or repayment schedule and I am following it',tier:3,flags:['Payment plan or tax agreement']},{id:'dt-q5o4',text:'I am trying to figure out what to do, but I do not have a clear plan yet',tier:4,flags:['Active financial concern']},{id:'dt-q5o5',text:'No steps yet, stopped paying, ignored it, or fell behind on a plan',tier:4,flags:['Active financial concern','No action taken']}]},{id:'dt-q6',order:6,text:'Do you have documents showing what happened and what you have done?',options:[{id:'dt-q6o1',text:'Yes, I have organized records and proof',tier:1,flags:[]},{id:'dt-q6o2',text:'Some, but I am missing key records',tier:2,flags:['Missing financial records']},{id:'dt-q6o3',text:'No, not yet',tier:2,flags:['Missing financial records']},{id:'dt-q6o4',text:'I am not sure what documents I need',tier:2,flags:['Missing financial records','Documentation gap']}]},{id:'dt-q7',order:7,text:'Are you worried about how you disclosed, reported, or explained the financial issue?',options:[{id:'dt-q7o1',text:'No',tier:1,flags:[]},{id:'dt-q7o2',text:'Maybe — I have not submitted yet',tier:2,flags:['Disclosure concern']},{id:'dt-q7o3',text:'Maybe — I submitted and am not sure whether I answered correctly',tier:5,tag:'disclosure-uncertainty',flags:['Disclosure accuracy concern']},{id:'dt-q7o4',text:'Yes, I omitted something or gave the wrong dates, amounts, or status',tier:5,tag:'disclosure-omission',flags:['Disclosure accuracy concern','Omission or misstatement']},{id:'dt-q7o5',text:'Yes, I gave different information before',tier:5,tag:'disclosure-inconsistency',flags:['Disclosure accuracy concern','Inconsistent information']},{id:'dt-q7o6',text:'I hold a clearance and am not sure whether I need to self-report it',tier:5,tag:'self-reporting-concern',flags:['Self-reporting concern']}]},{id:'dt-q8',order:8,text:'Has anyone contacted you about the financial issue?',options:[{id:'dt-q8o1',text:'No',tier:1,flags:[]},{id:'dt-q8o2',text:'An investigator, FSO, security office, HR, command, or supervisor asked basic questions',tier:4,tag:'agency-contact',flags:['Government or security office contact']},{id:'dt-q8o3',text:'I was asked for a written statement, documents, or explanation',tier:5,tag:'written-request',flags:['Written request from government']},{id:'dt-q8o4',text:'I received an LOI, SOR, interrogatories, denial, suspension, revocation, hearing notice, or appeal deadline',tier:5,tag:'formal-action',flags:['LOI, SOR, or formal government action']},{id:'dt-q8o5',text:'I have a deadline, the deadline passed, or I am not sure when something is due',tier:5,tag:'deadline-concern',flags:['Deadline concern']}]},{id:'dt-q9',order:9,text:'What would you like help with?',options:[{id:'dt-q9o1',text:'Understanding whether the financial issue matters',tier:1,flags:[]},{id:'dt-q9o2',text:'Preparing for the SF-86/SF-85/SF-85P or investigator interview',tier:1,flags:[]},{id:'dt-q9o3',text:'Gathering documents or explaining mitigation',tier:3,flags:['Documentation needed']},{id:'dt-q9o4',text:'Fixing, updating, or self-reporting a prior answer',tier:5,flags:['Disclosure accuracy concern']},{id:'dt-q9o5',text:'Responding to LOI/SOR/interrogatories, denial, suspension, revocation, or appeal',tier:5,flags:['LOI, SOR, or formal government action']}]}],results:[{tier:1,label:'No Major Financial Issue Flagged — Keep It Accurate',forPeopleWith:'People with no financial issue, no missing records, no disclosure concern, and no government contact.',message:'Your answers did not flag an obvious financial clearance concern in this quiz. The most important next step is accuracy: keep your financial, tax, credit, and court-related information complete and consistent.',ctaText:'Download the Financial Clearance Final Review Checklist',ctaType:'download',tags:[]},{tier:2,label:'Information or Documentation Gap — Pull Records First',forPeopleWith:'People with unknown credit report issues, missing documents, uncertain tax records, or unclear payment status.',message:'Your answers suggest the biggest issue may be incomplete information. Before submitting, updating, or explaining anything, gather the records needed to understand the issue clearly.',ctaText:'Get the Financial Records Checklist',ctaType:'download',tags:[]},{tier:3,label:'Resolved or Managed Financial Issue — Document Your Mitigation',forPeopleWith:'People with past debt, late payments, collections, tax issues, or bankruptcy that has been resolved or is on a payment plan.',message:'Your answers suggest the financial issue may already be resolved or being handled. The key is showing what happened, what changed, and what documents support your explanation.',ctaText:'Get the Financial Mitigation Checklist',ctaType:'download',tags:[{id:'tax-issue',label:'Tax Debt or IRS Issue',message:'Tax debt and unfiled returns are treated as a distinct category in security clearance financial reviews. Investigators consider whether the problem reflects poor financial judgment, willful non-compliance, or a temporary hardship — and whether you are taking concrete steps to resolve it. The IRS offers installment agreements, currently-not-collectible status, and offer-in-compromise programs that adjudicators recognize as responsible mitigation steps. Gather complete records: the IRS transcript showing what is owed, any notices, and documentation of your payment agreement or resolution plan.'},{id:'bankruptcy-judgment',label:'Bankruptcy, Judgment, Lien, or Garnishment',message:'Bankruptcies, civil judgments, liens, wage garnishments, foreclosures, and repossessions are all disclosable events that will appear in your financial and court record review. These are not automatic disqualifiers — what matters is the cause, the timeline, and how the situation has been resolved. Documentation is critical: the bankruptcy filing and discharge paperwork, the judgment or lien records, any satisfaction of judgment, and evidence of current financial stability. An organized, well-documented explanation of what happened and what has changed carries significant weight in the mitigation analysis.'},{id:'gambling-unexplained',label:'Gambling, Unexplained Income, or Unexplained Assets',message:'Gambling problems, unexplained income, and unexplained assets are among the more sensitive financial concerns in clearance investigations because they can suggest coercion risk, undisclosed foreign income, unreported activities, or financial instability. If gambling is involved, documentation of cessation, treatment if applicable, and financial recovery are the key mitigation factors. If the concern involves unexplained income or assets, documented source verification is essential. An attorney can help you structure an accurate, complete explanation before submitting.'}]},{tier:4,label:'Active Financial Concern — Action Plan May Matter',forPeopleWith:'People with current delinquent debt, unpaid taxes, unresolved collections, no payment plan, or ongoing financial problems.',message:'Your answers suggest there may be an active financial issue that needs attention. A financial red flag does not automatically decide the outcome, but the way you address, document, and explain the issue can matter.',ctaText:'Schedule a Financial Clearance Strategy Consultation',ctaType:'schedule',tags:[{id:'active-delinquency',label:'Currently Delinquent — No Resolution Yet',message:'An active, unresolved delinquency — debt that is currently past due with no payment plan or resolution in place — is a factor that adjudicators take seriously, not because past-due debt automatically disqualifies an applicant, but because the absence of a plan raises questions about financial responsibility going forward. The most effective step you can take now is to develop and document a concrete resolution plan. Even a recent commitment to address the issue — if documented and consistent — can significantly change the analysis.'},{id:'active-legal-action',label:'Active Legal or Collection Action',message:'An active lawsuit, judgment, garnishment, lien, levy, foreclosure, or eviction proceeding is a more serious financial concern than unpaid debt alone because it has escalated into a formal legal action that is easily documentable by investigators. At this stage, the most important steps are understanding the specific action, identifying what resolution options remain, and developing a plan. An attorney who handles both financial clearance issues and the underlying legal matter can help you address both simultaneously.'},{id:'pattern-concern',label:'Pattern of Financial Problems',message:'A pattern of repeated financial problems — recurring late payments, ongoing debt, or multiple missed obligations — raises a different concern than a one-time hardship. Investigators distinguish between a temporary crisis that resolved and did not recur, and a behavioral pattern that suggests ongoing financial judgment issues. If your situation involves repeated problems over time, the most important elements of your mitigation are demonstrating what specifically changed, why it will not recur, and what steps are in place to maintain financial stability going forward.'},{id:'gambling-risk',label:'Gambling or Unexplained Assets as a Cause',message:'When gambling is identified as a cause of financial problems, adjudicators treat it as a more complex concern than simple overspending or hardship — because gambling suggests an ongoing risk of coercion, unexplained financial activity, and potential recurrence. If the gambling has stopped, documentation of cessation, treatment if applicable, and financial recovery is critical. If the concern involves unexplained income or assets, be prepared to provide documented source verification. An attorney can help you structure an explanation that addresses the security concern directly.'},{id:'agency-contact',label:'Investigator or Security Office Has Asked Questions',message:'You indicated that an investigator, FSO, security office, HR, command, or supervisor has already asked questions about the financial issue. This means the matter has entered the formal investigation record. How you respond to any follow-up questions — and whether your answers are consistent with your submitted paperwork — matters. If you receive a request for documents, additional questions, or a written statement, consult an attorney before responding.'}]},{tier:5,label:'Disclosure or Government Action Concern — High Urgency',forPeopleWith:'People with a possible omission, inaccurate prior answer, self-reporting concern, written request, LOI, SOR, denial, suspension, revocation, or deadline.',message:'Your answers suggest the issue may involve disclosure accuracy, self-reporting, or a government response stage. Before submitting a correction, written statement, or response, identify the document type, deadline, agency, and allegations.',ctaText:'Request an Urgent Financial Clearance Case Review',ctaType:'contact',tags:[{id:'disclosure-uncertainty',label:'Submitted — Not Sure If Answer Was Correct',message:'Uncertainty about whether a prior submission was accurate is a disclosure concern that should be resolved before the investigation advances further. If you answered incorrectly, the best outcome comes from identifying and correcting the issue proactively — before the investigator asks about it. Before contacting your FSO or security officer, understand exactly what you submitted and what the correct answer should be. An attorney can help you determine the scope of the issue and the best approach for correcting it without creating additional risk.'},{id:'disclosure-omission',label:'Omission or Inaccurate Prior Answer',message:'Omitting financial information or providing inaccurate dates, amounts, or status on a clearance-related submission can become a candor concern that outlasts the underlying financial issue. Before submitting any correction, understand exactly what you submitted, identify the specific gap or inaccuracy, and determine whether the problem appears inadvertent or part of a pattern. An attorney can help you frame and submit a correction in a way that presents the facts accurately and minimizes additional risk.'},{id:'disclosure-inconsistency',label:'Inconsistent Prior Answer',message:'If your current understanding of the financial issue differs from what you previously told an investigator, submitted on a clearance application, or stated in a security interview, the inconsistency will likely be identified and flagged. Before taking any action, identify the specific discrepancy and its cause — changed facts, better records, or a prior error. An attorney can help you understand the scope of the inconsistency, determine the best way to address it, and prepare an explanation that is accurate and appropriately framed.'},{id:'self-reporting-concern',label:'Active Clearance Holder — Self-Reporting Question',message:'Active clearance and public trust position holders have ongoing self-reporting obligations when their financial circumstances change in ways that could affect their eligibility. If you are unsure whether your financial situation requires a self-report, the safest step is to confirm your agency\'s specific self-reporting requirements — and to do so before the issue is identified in a reinvestigation or reported by a third party. An attorney who handles security clearance matters can help you evaluate whether a report is required and how to prepare it.'},{id:'written-request',label:'Written Request for Statement or Documents',message:'A written request for a financial statement, documents, or explanation means the security review has reached a formal stage — your response will be part of the official record. Before responding, understand exactly what is being asked, gather the relevant records, and make sure your response is accurate and consistent with everything you have previously submitted. An attorney can review the specific request and help you respond in a way that is complete, accurate, and appropriately framed for the security review process.'},{id:'formal-action',label:'LOI, SOR, Denial, Suspension, or Revocation',message:'A Letter of Interrogatory, Statement of Reasons, denial notice, suspension, or revocation related to a financial matter is a formal government action with legal deadlines and procedural requirements. Missing a deadline or responding without legal review is one of the most common — and most costly — mistakes in clearance appeals. An attorney who handles security clearance appeals can identify the specific allegations, the applicable adjudicative standards, and the response strategy that gives you the best chance of a favorable outcome.'},{id:'deadline-concern',label:'Deadline — Approaching, Missed, or Uncertain',message:'A deadline related to a financial disclosure, self-report, or government response is time-sensitive. The longer you wait, the harder it becomes to explain any delay as inadvertent rather than deliberate — and a missed response deadline can itself become a ground for adverse action. If you are uncertain whether a deadline has passed, act as if it has. An attorney can help you identify the applicable deadline, assess whether it has been missed, and determine the best approach for responding — even if the deadline has already passed.'}]}],availableFlags:['Financial issue','Debt or collections','Tax issue','Bankruptcy or judgment','Gambling or unexplained assets','Resolved financial issue','Payment plan or tax agreement','Active financial concern','Current delinquency','Active legal or collection action','Financial hardship','Repeated financial problems','No action taken','Missing financial records','Documentation gap','Documentation needed','Disclosure concern','Disclosure accuracy concern','Omission or misstatement','Inconsistent information','Self-reporting concern','Government or security office contact','Written request from government','LOI, SOR, or formal government action','Deadline concern'],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'What type of issue?',issueTypeOptions:['Debt','Taxes','Bankruptcy','Collections','Garnishment','SOR or LOI','Other']}},{id:'self-reporting-checker',version:2,slug:'self-reporting-checker',title:'Self-Reporting Checker',subtitle:'Do You Need to Report This to Your Security Office?',groundingNote:"DCSA says clearance holders are required to self-report life events or incidents that could affect clearance eligibility, and that agencies may have different self-reporting procedures.",questions:[{id:'sr-q1',order:1,text:'What best describes your current status?',options:[{id:'sr-q1o1',text:'I currently hold a security clearance',tier:1,flags:[]},{id:'sr-q1o2',text:'I hold a public trust or sensitive position',tier:1,flags:[]},{id:'sr-q1o3',text:'I am an applicant or recently submitted, but I do not hold the clearance/position yet',tier:2,flags:['May not be covered by self-reporting requirements'],tag:'reporting-coverage'},{id:'sr-q1o4',text:'My access, clearance, or position is already suspended, restricted, or under review',tier:5,flags:['Access suspended or under review'],tag:'access-restricted'}]},{id:'sr-q2',order:2,text:'Any foreign travel, foreign contact, or foreign interest issue?',options:[{id:'sr-q2o1',text:'No',tier:1,flags:[]},{id:'sr-q2o2',text:'Foreign travel outside the U.S., including planned, recent, or unexpected travel',tier:3,flags:['Foreign travel'],tag:'foreign-issue'},{id:'sr-q2o3',text:'Foreign spouse, partner, roommate, close contact, or continuing foreign contact',tier:3,flags:['Foreign contact or relationship'],tag:'foreign-issue'},{id:'sr-q2o4',text:'Foreign citizenship, passport, voting, property, bank account, business, or financial interest',tier:3,flags:['Foreign citizenship or financial interest'],tag:'foreign-issue'},{id:'sr-q2o5',text:'I am not sure what foreign-related information counts',tier:2,flags:['Uncertainty about foreign reporting']}]},{id:'sr-q3',order:3,text:'Any police, criminal, DUI, or court issue?',options:[{id:'sr-q3o1',text:'No',tier:1,flags:[]},{id:'sr-q3o2',text:'Older or minor matter, now resolved',tier:2,flags:['Police or court history']},{id:'sr-q3o3',text:'Recent arrest, charge, DUI/DWI, summons, upcoming court date, probation/parole, or unresolved case',tier:3,flags:['Police or court history','Recent or pending legal matter'],tag:'criminal-matter'},{id:'sr-q3o4',text:'Serious or sensitive matter (felony, domestic violence, protective order, violence, firearms/explosives, or drug-related)',tier:3,flags:['Police or court history','Serious criminal matter'],tag:'criminal-matter'},{id:'sr-q3o5',text:'I am not sure whether I need to report it',tier:2,flags:['Disclosure uncertainty']}]},{id:'sr-q4',order:4,text:'Any financial issue?',options:[{id:'sr-q4o1',text:'No',tier:1,flags:[]},{id:'sr-q4o2',text:'Past financial issue, now resolved',tier:2,flags:['Financial issue']},{id:'sr-q4o3',text:'Current delinquent debt, collections, charge-offs, or inability to meet financial obligations',tier:3,flags:['Financial issue','Current delinquency'],tag:'financial-concern'},{id:'sr-q4o4',text:'Tax debt, bankruptcy, wage garnishment, lien, foreclosure, or eviction',tier:3,flags:['Financial issue','Tax or bankruptcy issue'],tag:'financial-concern'},{id:'sr-q4o5',text:'I am not sure what appears on my credit report or public records',tier:2,flags:['Unknown credit or public records']}]},{id:'sr-q5',order:5,text:'Any drug, alcohol, substance, or treatment-related issue?',options:[{id:'sr-q5o1',text:'No',tier:1,flags:[]},{id:'sr-q5o2',text:'Older isolated issue, now resolved',tier:2,flags:['Drug or alcohol issue']},{id:'sr-q5o3',text:'Recent marijuana/THC, drug, CBD/delta, or positive drug test issue',tier:3,flags:['Drug or substance issue'],tag:'substance-issue'},{id:'sr-q5o4',text:'DUI/DWI, alcohol-related incident, repeated alcohol incidents, or work/school/military alcohol issue',tier:3,flags:['Alcohol incident'],tag:'substance-issue'},{id:'sr-q5o5',text:'Substance abuse counseling/treatment, relapse, or counseling ordered because of conduct or performance',tier:3,flags:['Substance counseling or treatment'],tag:'substance-issue'}]},{id:'sr-q6',order:6,text:'Any classified information, security, cyber, media, or outside activity issue?',options:[{id:'sr-q6o1',text:'No',tier:1,flags:[]},{id:'sr-q6o2',text:'Lost or mishandled classified/sensitive information, badge, device, credentials, or government property',tier:5,flags:['Classified information or security incident'],tag:'security-incident'},{id:'sr-q6o3',text:'Possible unauthorized disclosure, spillage, cyber/IT misuse, or security violation',tier:5,flags:['Unauthorized disclosure or cyber issue'],tag:'security-incident'},{id:'sr-q6o4',text:'Foreign person asked about sensitive work, suspicious contact, coercion, blackmail, or exploitation concern',tier:5,flags:['Suspicious contact or coercion'],tag:'suspicious-contact'},{id:'sr-q6o5',text:'Outside employment/volunteer activity, foreign business, media contact, publication, public speaking, or concern about another covered person',tier:3,flags:['Outside activity or media contact'],tag:'outside-activity'}]},{id:'sr-q7',order:7,text:'Have you already reported the issue?',options:[{id:'sr-q7o1',text:'No, I have not reported it yet',tier:1,flags:[]},{id:'sr-q7o2',text:'Yes, I reported it verbally or informally',tier:2,flags:['Informal report only'],tag:'informal-report'},{id:'sr-q7o3',text:'Yes, I reported it in writing',tier:1,flags:[]},{id:'sr-q7o4',text:'I may have waited too long',tier:4,flags:['Reporting delay'],tag:'reporting-delay'},{id:'sr-q7o5',text:'I may have left something out or given inconsistent details',tier:4,flags:['Incomplete or inconsistent report'],tag:'incomplete-report'}]},{id:'sr-q8',order:8,text:'Has anyone contacted you, or is there a deadline?',options:[{id:'sr-q8o1',text:'No',tier:1,flags:[]},{id:'sr-q8o2',text:'My FSO, security office, HR, command, or supervisor asked basic follow-up questions',tier:3,flags:['Security office contact']},{id:'sr-q8o3',text:'I was asked for a written statement, documents, or explanation',tier:5,flags:['Written request from security office'],tag:'formal-inquiry'},{id:'sr-q8o4',text:'My access was suspended/restricted, or I received formal written questions or notice',tier:5,flags:['Access suspended or formal notice'],tag:'formal-inquiry'},{id:'sr-q8o5',text:'I have a deadline, the deadline passed, or I am not sure when it is due',tier:5,flags:['Deadline concern'],tag:'urgent-deadline'}]},{id:'sr-q9',order:9,text:'What would you like help with?',options:[{id:'sr-q9o1',text:'Figuring out whether or how to report something',tier:2,flags:[]},{id:'sr-q9o2',text:'Preparing a self-report or explanation',tier:3,flags:[]},{id:'sr-q9o3',text:'Fixing a late, incomplete, or inconsistent report',tier:4,flags:[]},{id:'sr-q9o4',text:'Responding to security questions, a deadline, suspension, or access restriction',tier:5,flags:[]},{id:'sr-q9o5',text:'Just understanding my risk',tier:1,flags:[]}]}],results:[{tier:1,label:'No Obvious Reporting Trigger Flagged — Confirm Agency Rules',forPeopleWith:'People with no flagged event, no government contact, no reporting delay, and no security-sensitive issue.',message:'Your answers did not identify an obvious self-reporting obligation based on the categories reviewed. Self-reporting requirements vary by agency, clearance level, and position — and some events require reporting even if they seem minor. If anything has changed in your personal, financial, or professional life since your last investigation, review your agency\'s specific requirements before concluding no report is needed.',ctaText:'Download the Security Clearance Self-Reporting Checklist',ctaType:'download',tags:[]},{tier:2,label:'Possible Reporting Issue — Clarify Before You Assume',forPeopleWith:'People with uncertainty about whether they are covered, older or minor resolved issues, or informal reporting only.',message:'Your situation may involve a reporting obligation that depends on specific details — your agency\'s policy, the timing of the event, how it was documented, and your current status. Before concluding no report is needed, confirm your agency\'s self-reporting procedures, gather the relevant dates and documents, and consider consulting a security clearance attorney if the situation remains unclear.',ctaText:'Get the Self-Reporting Preparation Checklist',ctaType:'download',tags:[{id:'reporting-coverage',label:'Am I Even Covered?',message:'You indicated you may not yet hold the clearance or position. Self-reporting requirements formally apply to clearance holders, but many attorneys recommend proactively documenting and reporting events that occur during a pending investigation — a later omission can create a bigger problem than the event itself. An attorney can help you decide whether voluntary disclosure makes sense in your situation.'},{id:'informal-report',label:'Verbal or Informal Report Only',message:'You reported verbally or informally. Verbal reports create no paper trail — if the event later surfaces in a reinvestigation or formal inquiry, there may be no record that you disclosed it. Consider following up in writing to your FSO or security office to create a documented record of your disclosure, even if a formal written report was not required.'}]},{tier:3,label:'Likely Self-Reporting Issue — Prepare a Clear Report',forPeopleWith:'People with foreign travel, foreign contacts, arrests, DUI or court issues, financial problems, drug or alcohol issues, or outside activities.',message:'Based on your answers, you appear to have a self-reporting obligation. The most important next step is preparing an accurate, complete account: what happened, when it happened, who was involved, whether it is ongoing, and what steps you have taken. A clear, organized self-report submitted before you are asked is consistently treated more favorably than one submitted after an investigation begins.',ctaText:'Schedule a Self-Reporting Strategy Consultation',ctaType:'schedule',tags:[{id:'foreign-issue',label:'Foreign Contact, Travel, or Interest',message:'Foreign travel, contacts, and financial interests are among the most frequently missed self-reporting categories. The obligation is not limited to contacts with hostile or covert actors — continuing relationships with foreign nationals, foreign travel (including personal travel), and foreign financial interests may all require disclosure. Your agency\'s FSO or reporting form can clarify what must be documented and when.'},{id:'criminal-matter',label:'Police, Court, or Legal Matter',message:'Arrests, criminal charges, DUIs, summons, and court appearances are typically self-reportable — often regardless of how the case is ultimately resolved or whether the record was expunged. The reporting obligation usually begins when the event occurs, not when the case closes. If you are unsure whether a specific matter is covered, document the full timeline and confirm with your FSO or an attorney before the deadline passes.'},{id:'financial-concern',label:'Financial or Debt Issue',message:'Financial problems — including unpaid debt, collections, judgments, garnishments, tax issues, and bankruptcy — can raise concerns under the financial considerations adjudicative guideline. What matters most is not only what happened, but whether you are taking steps to address it. A voluntary, organized disclosure that explains the circumstances and your plan to resolve the issue is far more effective than silence or a delayed report.'},{id:'substance-issue',label:'Drug, Alcohol, or Treatment Issue',message:'Drug use, alcohol incidents, and treatment history — including a positive drug test, DUI, alcohol-related incident, or referral for counseling — are typically reportable events, even when no legal action resulted. Agencies are required to consider context and rehabilitation, and voluntary disclosure before you are asked is consistently treated more favorably than a disclosure prompted by a third-party report or investigation.'},{id:'outside-activity',label:'Outside Employment or Media Activity',message:'Outside employment, consulting work, business activity, media contact, or public speaking related to your work or expertise may require prior approval or post-activity reporting depending on your agency and position. The obligations vary — some agencies require only disclosure after the fact, others require advance written approval. Confirm with your FSO before taking on any outside activity, and document any approval you receive.'}]},{tier:4,label:'Delay or Disclosure Concern — Be Careful Before Correcting',forPeopleWith:'People with a late report, incomplete report, inconsistent details, or omitted facts.',message:'Your answers suggest the issue may involve not only what happened, but also how and when it was reported. A late, incomplete, or inconsistent self-report creates a separate concern beyond the original event — specifically, whether the problem reflects an oversight or a pattern of poor candor. Before submitting any correction or supplement, organize the full timeline, identify what was and was not reported, and understand the reason the gap occurred.',ctaText:'Speak with a clearance attorney before correcting or supplementing a report',ctaType:'contact',tags:[{id:'reporting-delay',label:'Possible Late Report',message:'A delayed self-report raises two issues: the underlying event, and the failure to report it on time. How the delay is explained — and how quickly you act now — can significantly affect how the situation is evaluated. Investigators distinguish between an oversight and an intentional omission. An attorney can help you characterize the delay accurately, identify any mitigating factors, and submit a late report in a way that minimizes additional risk.'},{id:'incomplete-report',label:'Incomplete or Inconsistent Report',message:'An incomplete or inconsistent self-report can raise candor concerns that outlast the original issue. Before submitting any correction, you need to understand exactly what you previously reported, identify the specific gap or inconsistency, and determine the best approach — whether that is a written supplement, a corrected statement, or a formal clarification. An attorney can review your prior report and help you close the gap without creating additional problems.'}]},{tier:5,label:'Security Incident, Formal Inquiry, or Deadline — High Urgency',forPeopleWith:'People with classified information issues, unauthorized disclosure, suspicious contact, written security questions, access restriction, suspension, or deadline.',message:'Your answers suggest this situation requires prompt attention. The facts, the timing, and how you respond now can significantly affect the outcome. If you have been contacted by a security office, received a formal request, or have a deadline approaching, the decisions you make in the next few days matter. A security clearance attorney can help you understand what is being asked and how to respond accurately, completely, and in a way that protects your interests.',ctaText:'Request an urgent case review',ctaType:'contact',tags:[{id:'security-incident',label:'Classified Information or Security Incident',message:'Lost, mishandled, or improperly disclosed classified or sensitive information is treated as a security incident — not just a reporting obligation. These incidents typically require reporting through formal channels immediately, and your response becomes part of your security file. An attorney can help you respond in a way that is accurate, complete, and protective of your interests, and advise you on how to cooperate with any follow-up inquiry.'},{id:'suspicious-contact',label:'Suspicious Contact or Coercion',message:'Contact by a foreign intelligence officer, solicitation of classified information, an attempted coercion, or a blackmail attempt must be reported immediately under 32 CFR and most agency security policies. Early disclosure — with legal guidance on what to say and how to say it — is far better than delayed reporting after a formal investigation begins. Do not discuss the contact with unauthorized persons, and consult an attorney before submitting any written statement.'},{id:'formal-inquiry',label:'Formal Security Review or Written Request',message:'A written request for information, a formal notice, or a requirement to provide a written statement signals that a security review has already begun. Your response at this stage is part of the official record and will be evaluated for accuracy, completeness, and consistency with other available information. An attorney can review the specific request and help you respond in a way that is accurate, thorough, and appropriately framed.'},{id:'access-restricted',label:'Access Suspended, Restricted, or Under Review',message:'An active suspension or restriction of your access or clearance means a formal security determination process has likely already begun. What you say — and when — during this period can significantly affect the outcome. In some cases, you have the right to a written explanation and an opportunity to respond. An attorney who handles security clearance matters can advise you on your rights, the likely process and timeline, and how to respond if your agency or command directs questions to you.'},{id:'urgent-deadline',label:'Deadline — Approaching or Missed',message:'A missed or uncertain deadline is a time-sensitive problem. The longer you wait, the harder it becomes to characterize any delay as inadvertent rather than deliberate. If a deadline has already passed, prompt action now — with a clear, documented explanation of why the report was delayed — is still better than continued silence. An attorney can help you move quickly, frame the situation accurately, and minimize the risk that the delay becomes the central issue.'}]}],availableFlags:['Foreign travel','Foreign contact or relationship','Foreign citizenship or financial interest','Uncertainty about foreign reporting','May not be covered by self-reporting requirements','Police or court history','Recent or pending legal matter','Serious criminal matter','Disclosure uncertainty','Financial issue','Current delinquency','Tax or bankruptcy issue','Unknown credit or public records','Drug or alcohol issue','Drug or substance issue','Alcohol incident','Substance counseling or treatment','Classified information or security incident','Unauthorized disclosure or cyber issue','Suspicious contact or coercion','Outside activity or media contact','Access suspended or under review','Informal report only','Reporting delay','Incomplete or inconsistent report','Security office contact','Written request from security office','Access suspended or formal notice','Deadline concern'],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[]}},{id:'content-removal-google',version:2,slug:'content-removal-google',title:'Can This Be Removed From Google?',subtitle:'Online Content Removal Assessment',groundingNote:'Every quiz result should be viewed as a starting point—not a final legal opinion. Content removal depends on who published it, what was published, and the publisher\'s policies.',scoringMode:'highest-tier',questions:[{id:'cr-q1',order:1,text:'What type of website published the content?',options:[{id:'cr-q1o1',text:'News organization or newspaper',tier:1,flags:[]},{id:'cr-q1o2',text:'Government website',tier:2,flags:[]},{id:'cr-q1o3',text:'Court records or public records website',tier:2,flags:[]},{id:'cr-q1o4',text:'Blog, forum, or personal website',tier:1,flags:[]}]},{id:'cr-q2',order:2,text:'Is the publication owned by one of these media companies?',showIf:{questionIndex:0,optionId:'cr-q1o1'},options:[{id:'cr-q2o1',text:'Yes — Gannett, Hearst, Lee Enterprises, Gray Media, CNHI, Daily Mail, Sun Sentinel, or their parent company',tier:3,tag:'publisher-policy',flags:[]},{id:'cr-q2o2',text:'No — Another company or independently owned',tier:1,flags:[]},{id:'cr-q2o3',text:"I'm not sure",tier:1,flags:[]}]},{id:'cr-q3',order:3,text:'Which best describes the underlying event?',options:[{id:'cr-q3o1',text:'It was not related to a crime.',tier:1,flags:[]},{id:'cr-q3o2',text:'A misdemeanor or lower-level offense.',tier:1,flags:[]},{id:'cr-q3o3',text:'A non-violent felony.',tier:1,flags:[]},{id:'cr-q3o4',text:'A violent, sexual, child-related, or widely publicized criminal case.',tier:3,tag:'public-interest',flags:[]}]},{id:'cr-q4',order:4,text:'If the content relates to a criminal matter, what was the outcome?',options:[{id:'cr-q4o1',text:'Charges were dismissed, I was found not guilty, or my record was expunged.',tier:1,flags:[]},{id:'cr-q4o2',text:'The case ended in diversion or another favorable resolution.',tier:1,flags:[]},{id:'cr-q4o3',text:'I was convicted.',tier:2,flags:[]},{id:'cr-q4o4',text:'The criminal case is still pending.',tier:3,tag:'pending-criminal-case',flags:[]},{id:'cr-q4o5',text:'This is not related to a criminal matter.',tier:1,flags:[]}]},{id:'cr-q5',order:5,text:'Which statement best describes the information?',options:[{id:'cr-q5o1',text:'It is false or contains significant inaccuracies.',tier:1,flags:[]},{id:'cr-q5o2',text:'It is mostly accurate but contains outdated or misleading information.',tier:1,flags:[]},{id:'cr-q5o3',text:'It is accurate but no longer reflects my life.',tier:1,flags:[]},{id:'cr-q5o4',text:'It is accurate and current.',tier:2,flags:[]}]},{id:'cr-q6',order:6,text:'Has the publisher already declined a request to remove the content?',options:[{id:'cr-q6o1',text:'No.',tier:1,flags:[]},{id:'cr-q6o2',text:'Yes, but I never received a response.',tier:1,flags:[]},{id:'cr-q6o3',text:'Yes, the publisher denied my request.',tier:3,tag:'prior-removal-denial',flags:[]},{id:'cr-q6o4',text:"I'm not sure.",tier:1,flags:[]}]},{id:'cr-q7',order:7,text:'Why are you seeking removal?',options:[{id:'cr-q7o1',text:'The information is false or significantly inaccurate.',tier:1,flags:[]},{id:'cr-q7o2',text:'The charges were dismissed or my record was expunged.',tier:1,flags:[]},{id:'cr-q7o3',text:'The information is outdated and no longer reflects my life.',tier:1,flags:[]},{id:'cr-q7o4',text:'I simply want it removed.',tier:1,flags:[]}]},{id:'cr-q8',order:8,text:'Since the content was published, have you obtained any of the following?',options:[{id:'cr-q8o1',text:'Expungement',tier:1,flags:[]},{id:'cr-q8o2',text:'Record sealing',tier:1,flags:[]},{id:'cr-q8o3',text:'Pardon',tier:1,flags:[]},{id:'cr-q8o4',text:'Other court order',tier:1,flags:[]},{id:'cr-q8o5',text:'None of the above',tier:1,flags:[]},{id:'cr-q8o6',text:"I'm not sure",tier:1,flags:[]}]}],results:[{tier:1,label:'No Significant Obstacles Identified',forPeopleWith:'People whose content was published on a blog, forum, personal site, or independently owned outlet without major criminal history or prior removal denial.',message:"Based on your answers, we did not identify any obvious obstacles that commonly prevent publishers from considering removal requests. That does not guarantee that content can be removed, but it suggests your matter may warrant a more detailed legal review. Every publisher has different policies, and every case presents unique facts. Our attorneys can evaluate the specific content, publisher, and legal history to determine which strategies may be available.",ctaText:'Schedule My Free Consultation',ctaType:'schedule',tags:[],resources:[{label:'How the Content Removal Process Works',url:'https://www.nationalsecuritylawfirm.com/how-the-content-removal-process-works-at-nslf/'},{label:'What Makes a Good Case for Content Removal',url:'https://www.nationalsecuritylawfirm.com/what-makes-a-good-case-for-content-removal/'},{label:'How Long Does the Content Removal Process Take?',url:'https://www.nationalsecuritylawfirm.com/how-long-does-the-content-removal-process-take/'},{label:'Frequently Asked Questions About Content Removal',url:'https://www.nationalsecuritylawfirm.com/frequently-asked-questions-about-content-removal-with-national-security-law-firm/'}]},{tier:2,label:'Potential Challenges Identified',forPeopleWith:'People whose content appeared on a government or court records site, involved a conviction, or involves accurate and current information.',message:"Based on your answers, your matter appears to involve one or more factors that may make removal more challenging. This does not necessarily mean removal is unavailable. Rather, it suggests that success may depend on the specific publisher, the facts surrounding the underlying event, the legal outcome, and the strategy used. Many successful matters involve careful legal analysis, supporting documentation, and identifying approaches that may not be obvious from the article alone.",ctaText:'Schedule My Free Consultation',ctaType:'schedule',tags:[],resources:[{label:'How to Maximize Your Chances of Successfully Removing Harmful Online Content',url:'https://www.nationalsecuritylawfirm.com/how-to-maximize-your-chances-of-successfully-removing-harmful-online-content/'},{label:'The Dual Strategy: Pursuing Both Content Removal and Suppression at the Same Time',url:'https://www.nationalsecuritylawfirm.com/the-dual-strategy-approach-pursuing-both-content-removal-and-suppression-at-the-same-time/'},{label:'Removal vs. Deindexing vs. Suppression: What Clients Need to Know',url:'https://www.nationalsecuritylawfirm.com/why-article-removal-deindexing-or-anonymization-is-better-than-suppression-and-why-you-should-always-try-it-first/'},{label:'Frequently Asked Questions About Content Removal',url:'https://www.nationalsecuritylawfirm.com/frequently-asked-questions-about-content-removal-with-national-security-law-firm/'}]},{tier:3,label:'Significant Obstacles Identified — Further Review Recommended',forPeopleWith:'People whose content involves a major media company, a pending criminal case, a prior removal denial, or a high-profile matter.',message:"Your assessment identified one or more significant obstacles that may affect the likelihood of content removal. These obstacles do not necessarily mean your matter cannot be addressed—they simply mean a more individualized legal analysis is warranted. During your free consultation, an attorney can review the publisher, the underlying facts, and any legal or strategic options that may still be available.",ctaText:'Schedule My Free Consultation',ctaType:'schedule',tags:[{id:'publisher-policy',label:'Publisher Policy',url:'https://www.nationalsecuritylawfirm.com/why-diy-requests-often-backfire-your-one-shot-at-removal/',message:"Based on your answers, the primary obstacle appears to be the publisher's editorial policies. Certain large media organizations maintain longstanding editorial policies under which they rarely remove lawfully published articles—even when charges are later dismissed, records are expunged, or an individual has significantly rebuilt their life. That does not necessarily mean your matter has no viable options. Publisher policies evolve, exceptions sometimes exist, and the specific facts of your case—including the accuracy of the article, legal developments, and any privacy concerns—can materially affect the analysis. Our attorneys can evaluate whether there are any legal or strategic avenues that may still be worth pursuing."},{id:'pending-criminal-case',label:'Pending Criminal Case',url:'https://www.nationalsecuritylawfirm.com/why-expungement-does-not-remove-articles-from-the-internet-legal-and-practical-reasons/',message:"Based on your answers, it appears the underlying criminal matter has not yet been resolved. Most publishers are reluctant to consider removing or substantially modifying articles while criminal charges remain pending because the facts and legal outcome have not yet been determined. Once your case is resolved, the analysis often changes significantly. Depending on the final outcome—including dismissal, acquittal, diversion, or expungement—additional options may become available. If your case has recently been resolved or circumstances have changed, we encourage you to schedule a consultation for an updated evaluation."},{id:'prior-removal-denial',label:'Prior Removal Denial',url:'https://www.nationalsecuritylawfirm.com/what-to-do-when-a-website-refuses-to-remove-an-article/',message:"Based on your answers, it appears the publisher has previously declined a request to remove the content. A prior denial is an important factor because it may indicate the publisher has already considered—and rejected—a removal request. However, this does not automatically end the analysis. Our attorneys would want to understand: who submitted the request, whether it was sent to the appropriate decision-maker, what information or legal arguments were presented, how long ago the request was made, and whether circumstances have changed. In many cases, a professionally prepared legal request supported by additional documentation may differ substantially from an earlier request submitted without legal representation."},{id:'public-interest',label:'Public Interest',url:'https://www.nationalsecuritylawfirm.com/the-first-amendment-vs-your-reputation-where-the-line-is-drawn/',message:"Based on your answers, the content appears to involve a matter that many publishers consider to be of significant public interest. Publishers are generally less likely to remove articles involving serious criminal allegations, violent offenses, child-related offenses, homicide, terrorism, public corruption, or other highly newsworthy events because they often view those stories as having ongoing historical or public value. That does not necessarily mean removal is impossible. The specific facts of the case, the publisher involved, the legal outcome, the passage of time, and subsequent developments can all influence whether any options may exist."}],resources:[{label:'What To Do When a Website Refuses to Remove an Article',url:'https://www.nationalsecuritylawfirm.com/what-to-do-when-a-website-refuses-to-remove-an-article/'},{label:'7 Costly Mistakes People Make When Trying to Remove Online Content',url:'https://www.nationalsecuritylawfirm.com/7-costly-mistakes-people-make-when-trying-to-remove-online-content-and-how-to-avoid-them/'},{label:'Why Reputation Management Companies Often Fail',url:'https://www.nationalsecuritylawfirm.com/why-reputation-management-companies-often-fail/'},{label:'Why You Should Hire a Lawyer, Not a Reputation Management Company',url:'https://www.nationalsecuritylawfirm.com/why-you-should-hire-a-content-removal-lawyer-not-a-reputation-management-company/'}]}],availableFlags:[],leadCapture:{fields:['name','email','phone','deadline'],issueTypeLabel:'',issueTypeOptions:[],customFields:[{label:'URL(s) to the content you want removed',type:'textarea',placeholder:'https://example.com/article...',required:false}]}},{id:'military-discharge-upgrade',slug:'military-discharge-upgrade',title:'Military Discharge Upgrade Assessment',subtitle:'NSLF Attorney Assessment Engine',groundingNote:'This assessment does not predict whether your discharge will be upgraded. It identifies the legal issues, strengths, challenges, and potential forms of relief that one of our military attorneys would likely evaluate during an initial consultation.',scoringMode:'tag-collection',tagLibrary:{'liberal-consideration':{category:'theories',label:'PTSD / TBI Liberal Consideration',message:'Based on your answers, your case may involve PTSD, TBI, MST, or another behavioral health condition. Military review boards are required to give liberal or special consideration to certain mental health conditions when supported by the evidence. One of our attorneys can evaluate whether this guidance may apply in your case.'},'error-injustice':{category:'theories',label:'Possible Error or Injustice',message:'Your answers suggest there may be questions regarding whether the military fully considered all relevant facts or followed the proper process. An attorney can review your records to determine whether a legal error or injustice may have occurred.'},'rehabilitation':{category:'theories',label:'Strong Post-Service Rehabilitation',message:'Your answers indicate that you have made meaningful positive changes since leaving the military. Evidence of rehabilitation, stable employment, education, treatment, community involvement, or other accomplishments may strengthen a discharge upgrade petition.'},'new-evidence':{category:'theories',label:'New Evidence',message:'Your answers suggest that evidence may now exist that was unavailable or not considered when your discharge was issued. New evidence can be an important factor in some discharge upgrade cases.'},'inequity':{category:'theories',label:'Inequitable Treatment',message:'Your answers suggest the punishment or characterization you received may have been disproportionate or inequitable compared to the circumstances. An attorney can evaluate whether the discharge was proportional.'},'strong-prior-service':{category:'strengths',label:'Strong prior military service record'},'strong-rehabilitation':{category:'strengths',label:'Strong post-service rehabilitation'},'va-rating':{category:'strengths',label:'VA disability rating'},'medical-records':{category:'strengths',label:'Medical records or mental health records available'},'strong-evidence':{category:'strengths',label:'Supporting documentation available'},'punitive-discharge':{category:'challenges',label:'Punitive discharge (Bad Conduct or Dishonorable)'},'serious-offense':{category:'challenges',label:'Serious misconduct allegations'},'pattern-misconduct':{category:'challenges',label:'Pattern of misconduct'},'civilian-conviction':{category:'challenges',label:'Civilian criminal conviction'},'awol':{category:'challenges',label:'AWOL'},'prior-denial':{category:'challenges',label:'Prior discharge upgrade application was denied'},'evidence-needed':{category:'challenges',label:'Limited supporting documentation'},'unknown-basis':{category:'challenges',label:'Unclear or unknown separation basis'},'relief-character-upgrade':{category:'relief',label:'Character of Service Upgrade'},'relief-narrative-change':{category:'relief',label:'Narrative Reason Change'},'relief-re-code':{category:'relief',label:'RE Code Correction'},'relief-drb':{category:'relief',label:'Discharge Review Board Petition'},'relief-bcmr':{category:'relief',label:'Board for Correction of Military Records Petition'},'relief-va':{category:'relief',label:'VA Benefits Strategy'}},whyUs:'Military discharge upgrade cases are rarely won simply because someone deserves another chance. They are won by identifying legal error, injustice, mitigation, changes in military policy, mental health considerations, or compelling evidence of rehabilitation—and presenting those facts persuasively to the appropriate military review board. Our military law team includes former military judges, former Judge Advocates, former senior military officers, and attorneys who understand how discharge review boards and boards for correction of military records evaluate these cases. We do not simply review your DD Form 214—we analyze the legal theories, evidence, and available forms of relief to build the strongest case possible.',recommendedDocuments:['DD Form 214','Military separation packet or orders','VA rating decision','Medical records and mental health records','Prior Board decision (if applicable)','Character reference letters','Awards, commendations, and performance evaluations','Any evidence of rehabilitation or positive post-service changes'],questions:[{id:'du-q1',order:1,text:'What is your current discharge characterization?',options:[{id:'du-q1o1',text:'Honorable',tags:['relief-narrative-change','relief-re-code'],flags:[]},{id:'du-q1o2',text:'General (Under Honorable Conditions)',tags:['relief-character-upgrade'],flags:[]},{id:'du-q1o3',text:'Other Than Honorable (OTH)',tags:['relief-character-upgrade'],flags:[]},{id:'du-q1o4',text:'Bad Conduct or Dishonorable',tags:['punitive-discharge','relief-character-upgrade'],flags:[]},{id:'du-q1o5',text:"I'm not sure",tags:['unknown-basis'],flags:[]}]},{id:'du-q2',order:2,text:"Which of the following BEST matches the reason listed on your DD Form 214 for your separation? (If you don't know, choose the answer that best describes your situation.)",options:[{id:'du-q2o1',text:'Drug or alcohol-related misconduct',tags:[],flags:[]},{id:'du-q2o2',text:'Misconduct or disciplinary issues',tags:[],flags:[]},{id:'du-q2o3',text:'Medical or mental health condition',tags:[],flags:[]},{id:'du-q2o4',text:'Performance or administrative reasons',tags:[],flags:[]},{id:'du-q2o5',text:'I believe the military made a mistake or treated me unfairly',tags:['error-injustice'],flags:[]},{id:'du-q2o6',text:"I'm not sure",tags:['unknown-basis'],flags:[]}]},{id:'du-a1',order:3,text:'What best describes the drug or alcohol issue?',showIf:{questionIndex:1,optionId:'du-q2o1'},options:[{id:'du-a1o1',text:'Positive drug test',tags:[],f   <script>
const KEYS={quizzes:'ql_quizzes',responses:'ql_responses'};
const Storage={
  init(){const ex=JSON.parse(localStorage.getItem(KEYS.quizzes)||'[]');const exMap=new Map(ex.map(q=>[q.id,q]));const merged=SEED_QUIZZES.map(seed=>{const stored=exMap.get(seed.id);if(!stored)return seed;if(seed.version&&(!stored.version||seed.version>stored.version))return seed;return stored;});const seedIds=new Set(SEED_QUIZZES.map(q=>q.id));const user=ex.filter(q=>!seedIds.has(q.id));localStorage.setItem(KEYS.quizzes,JSON.stringify([...merged,...user]));},
  getQuizzes(){return JSON.parse(localStorage.getItem(KEYS.quizzes)||'[]');},
  getQuiz(id){return this.getQuizzes().find(q=>q.id===id||q.slug===id)||null;},
  saveQuiz(quiz){const qs=this.getQuizzes();const i=qs.findIndex(q=>q.id===quiz.id);if(i>=0)qs[i]=quiz;else qs.push(quiz);localStorage.setItem(KEYS.quizzes,JSON.stringify(qs));},
  deleteQuiz(id){localStorage.setItem(KEYS.quizzes,JSON.stringify(this.getQuizzes().filter(q=>q.id!==id)));},
  getResponses(){return JSON.parse(localStorage.getItem(KEYS.responses)||'[]');},
  saveResponse(r){const rs=this.getResponses();rs.unshift(r);localStorage.setItem(KEYS.responses,JSON.stringify(rs));},
  deleteResponse(id){localStorage.setItem(KEYS.responses,JSON.stringify(this.getResponses().filter(r=>r.id!==id)));},
  clearResponses(){localStorage.setItem(KEYS.responses,'[]');},
  scoreAnswers(quiz,opts){let max=1;const flags=[];for(const o of opts){if(o.tier>max)max=o.tier;for(const f of o.flags)if(!flags.includes(f))flags.push(f);}return{tier:max,result:quiz.results.find(r=>r.tier===max),flags:flags.slice(0,3)};},
  generateId(){return'id_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36);}
};
  </script>
  <script>
    const ICONS = ['📋', '💰', '🛡️', '📁', '⚖️'];

    function init() {
      Storage.init();
      const quizzes = Storage.getQuizzes();
      const grid = document.getElementById('quiz-grid');

      if (!quizzes.length) {
        grid.innerHTML = '<div class="empty-state">No quizzes yet. <a href="builder.html">Create one →</a></div>';
        return;
      }

      grid.innerHTML = quizzes.map((quiz, i) => {
        const qCount = quiz.questions.length;
        const icon = ICONS[i % ICONS.length];
        return `
          <div class="quiz-card">
            <div class="quiz-card-icon">${icon}</div>
            <h2>${escHtml(quiz.title)}</h2>
            <p>${escHtml(quiz.subtitle || '')}</p>
            <div class="quiz-meta">
              <span>${qCount} question${qCount !== 1 ? 's' : ''}</span>
              <span>·</span>
              <span>~${Math.ceil(qCount * 0.5)} min</span>
            </div>
            <a href="quiz.html?id=${encodeURIComponent(quiz.id)}">Take the Quiz →</a>
          </div>
        `;
      }).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    init();
  </script>
